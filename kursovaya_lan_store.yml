    - {text: "ИС — информационная система.", level: 1}
    - {text: "ИСПДн — информационная система персональных данных.", level: 1}
    - {text: "ЛВС — локальная вычислительная сеть.", level: 1}
    - {text: "НСД — несанкционированный доступ.", level: 1}
    - {text: "ПДн — персональные данные.", level: 1}
    - {text: "ПК — персональный компьютер.", level: 1}
    - {text: "ПО — программное обеспечение.", level: 1}
    - {text: "СБ — служба безопасности.", level: 1}
    - {text: "СКС — структурированная кабельная система.", level: 1}
    - {text: "СКУД — система контроля и управления доступом.", level: 1}
    - {text: "ККТ — контрольно-кассовая техника.", level: 1}
    - {text: "ОФД — оператор фискальных данных.", level: 1}
    - {text: "УЗ — уровень защищённости.", level: 1}
    - {text: "ACL — Access Control List, список контроля доступа.", level: 1}
    - {text: "ASW — Access Switch, коммутатор доступа.", level: 1}
    - {text: "DHCP — Dynamic Host Configuration Protocol, протокол динамической конфигурации узла.", level: 1}
    - {text: "DNS — Domain Name System, система доменных имён.", level: 1}
    - {text: "DSW — Distribution Switch, коммутатор распределения.", level: 1}
    - {text: "FTP — File Transfer Protocol, протокол передачи файлов.", level: 1}
    - {text: "HTTP — Hypertext Transfer Protocol, протокол передачи гипертекста.", level: 1}
    - {text: "LAN — Local Area Network, локальная вычислительная сеть.", level: 1}
    - {text: "NAT — Network Address Translation, трансляция сетевых адресов.", level: 1}
    - {text: "OSI — Open Systems Interconnection, эталонная модель взаимодействия открытых систем.", level: 1}
    - {text: "OSPF — Open Shortest Path First, протокол динамической маршрутизации по состоянию каналов.", level: 1}
    - {text: "PAT — Port Address Translation, трансляция адресов через порт.", level: 1}
    - {text: "VLAN — Virtual Local Area Network, виртуальная локальная сеть.", level: 1}

  # ─────────────────────────────────────────────────────────────────────────
  # ГЛАВА 1. АНАЛИЗ ПРЕДМЕТНОЙ ОБЛАСТИ
  # ─────────────────────────────────────────────────────────────────────────
  - type: heading
    level: 1
    text: Анализ предметной области
    id: ch_analysis

  - type: heading
    level: 2
    text: Характеристика объекта информатизации

  - type: paragraph
    text: "Объектом информатизации является магазин «Альфа-Маркет», расположенный в г. Энск по адресу: ул. Центральная, 1. Магазин занимает встроенно-пристроенное помещение общей площадью около 560 квадратных метров (торговая площадь — около 350 квадратных метров) на первом этаже жилого многоквартирного дома в густонаселённом районе города. Расположение в жилом микрорайоне в формате «магазин у дома» обеспечивает стабильный поток покупателей на протяжении всего рабочего дня."

  - type: paragraph
    text: "Магазин «Альфа-Маркет» — действующее малое предприятие розничной федеральной розничной сети, реализующее продовольственные товары повседневного спроса и сопутствующие непродовольственные товары. Ежедневно магазин обслуживает до 2500 покупателей; ассортимент насчитывает порядка 5000 товарных позиций. В часы пиковой нагрузки (вечерние часы и выходные дни) одновременно работают до шести кассовых узлов, включая кассы самообслуживания."

  - type: paragraph
    text: "Режим работы магазина — ежедневный, с 08:00 до 23:00. Численность штатного персонала, использующего автоматизированные рабочие места, составляет 33 человека, из которых 6 — кассиры и старший кассир (кассовая зона), 6 — сотрудники торгового зала (мерчандайзеры, менеджеры товарных категорий, оператор электронных ценников), 6 — работники склада и приёмки товара (кладовщики, приёмосдатчики, ревизор), 6 — сотрудники администрации (директор магазина, заместитель, два товароведа, два оператора-бухгалтера), 6 — сотрудники службы безопасности (операторы видеонаблюдения, контролёры торгового зала), 3 — сотрудники ИТ-сопровождения. На территории магазина размещены: торговый зал, кассовая зона с линией касс, склад и зона приёмки товара с разгрузочной рампой, кабинеты администрации, пост охраны с постом видеонаблюдения, серверная."

  - type: paragraph
    text: "В процессе функционирования объект обрабатывает следующие категории защищаемой информации: персональные данные покупателей — участников программы лояльности (ФИО, номер телефона, история покупок, состояние бонусного счёта), персональные данные сотрудников, фискальные данные контрольно-кассовой техники (кассовые чеки, сменные отчёты, данные для передачи оператору фискальных данных), сведения о товарных запасах, поставках и ценах, записи систем видеонаблюдения торгового зала и кассовой зоны, сведения о выручке, документы по охране труда и пожарной безопасности. Обработка перечисленных категорий информации регулируется Федеральным законом № 152-ФЗ «О персональных данных» [7], Федеральным законом № 54-ФЗ «О применении контрольно-кассовой техники» [16] и Законом Российской Федерации № 2300-1 «О защите прав потребителей» [5]."

  - type: heading
    level: 2
    text: Организационная структура и состав подразделений

  - type: paragraph
    text: "Организационная структура магазина «Альфа-Маркет» включает следующие подразделения: администрация (директор магазина, заместитель, товароведы и операторы-бухгалтеры — управленческий и учётный блок), кассовая зона (кассиры и старший кассир, обслуживающие контрольно-кассовую технику и приём безналичных платежей), торговый зал (мерчандайзеры, менеджеры товарных категорий, оператор системы электронных ценников и весового оборудования), склад и приёмка товара (кладовщики, приёмосдатчики, ревизор), служба безопасности (операторы видеонаблюдения и контролёры торгового зала), а также ИТ-сопровождение, обслуживающее серверную ферму магазина."

  - type: paragraph
    text: "Каждое из перечисленных подразделений обрабатывает свой состав информации и имеет свой профиль сетевого трафика. Так, кассовая зона взаимодействует с контрольно-кассовой техникой и формирует фискальный трафик к оператору фискальных данных и банку-эквайеру; торговый зал работает с системой управления ассортиментом, электронными ценниками и весовым оборудованием; склад и приёмка ведут учёт поставок и товарных запасов и обмениваются электронными документами с поставщиками; служба безопасности использует подсистемы видеонаблюдения и СКУД, изолированные от пользовательского трафика; ИТ-отдел обслуживает серверную ферму магазина. Для соответствия требованиям сегментации [7, 8] логически каждое подразделение должно находиться в отдельной подсети."

  - type: paragraph
    text: "В таблице {ref:tbl_departments} приведено распределение сотрудников и автоматизированных рабочих мест по подразделениям. Состав подразделений сформирован с учётом параметров варианта 9 курсовой работы: шесть виртуальных локальных сетей, минимальное число рабочих мест в каждой VLAN — шесть."

