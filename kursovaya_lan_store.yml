  - type: heading
    level: 0
    text: Приложение В

  - type: paragraph
    text: "Сводный листинг конфигурации активного коммутатора ядра CoreSW1 по результатам выполнения настроек подсистем маршрутизации на SVI, резервирования шлюзов HSRP, динамической маршрутизации OSPF, раздачи адресов и разграничения доступа. Конфигурация CoreSW2 идентична за исключением физических IP-адресов SVI, приоритета HSRP (резервный шлюз, приоритет по умолчанию 100) и идентификатора OSPF (`router-id 192.168.28.242`). Маршрут по умолчанию ядро получает динамически по OSPF от межсетевого экрана, поэтому статический `ip route 0.0.0.0` в конфигурации ядра отсутствует."

  - type: code
    caption: Сводная конфигурация коммутатора ядра CoreSW1
    id: lst_core_full
    code: |
      hostname CoreSW1
      !
      enable secret 5 $1$mERr$....
      service password-encryption
      ip routing
      ip domain-name 5ka.local
      username admin privilege 15 secret 5 $1$mERr$....
      !
      interface Vlan10
       ip address 192.168.28.2 255.255.255.240
       ip helper-address 192.168.28.116
       standby 10 ip 192.168.28.1
       standby 10 priority 110
       standby 10 preempt
      !
      interface Vlan20
       ip address 192.168.28.18 255.255.255.240
       ip helper-address 192.168.28.116
       ip access-group CASH-IN in
       standby 20 ip 192.168.28.17
       standby 20 priority 110
       standby 20 preempt
      !
      interface Vlan80
       ip address 192.168.28.114 255.255.255.240
       standby 80 ip 192.168.28.113
       standby 80 priority 110
       standby 80 preempt
      !
      interface Vlan999
       ip address 192.168.28.241 255.255.255.248
      !
      router ospf 1
       router-id 192.168.28.241
       passive-interface default
       no passive-interface Vlan999
       network 192.168.28.0 0.0.0.255 area 0
      !
      ip access-list extended CASH-IN
       permit tcp 192.168.28.16 0.0.0.15 host 192.168.28.114 eq 80
       permit tcp 192.168.28.16 0.0.0.15 host 192.168.28.114 eq 443
       permit udp 192.168.28.16 0.0.0.15 host 192.168.28.115 eq 53
       deny   ip  192.168.28.16 0.0.0.15 192.168.28.0 0.0.0.255
       permit ip  192.168.28.16 0.0.0.15 any
      !
      line con 0
       password 7 ....
       login
       exec-timeout 5 0
      line vty 0 4
       login local
       transport input ssh
       exec-timeout 5 0
      !
      banner motd ^ Authorized access only ^
      end

  - type: paragraph
    text: "Фрагмент конфигурации отказоустойчивой пары межсетевых экранов Cisco ASA (активное устройство FW1) с настройкой двух провайдеров, динамического PAT, анонсирования маршрута по умолчанию в OSPF и режима failover приведён ниже."

  - type: code
    caption: Фрагмент конфигурации межсетевого экрана FW1 (Cisco ASA)
    id: lst_fw_full
    code: |
      hostname FW1
      !
      interface GigabitEthernet0/0
       nameif outside1
       security-level 0
       ip address <ISP1-addr> 255.255.255.248
      interface GigabitEthernet0/1
       nameif outside2
       security-level 0
       ip address <ISP2-addr> 255.255.255.248
      interface GigabitEthernet0/2
       nameif inside
       security-level 100
       ip address 192.168.28.243 255.255.255.248 standby 192.168.28.244
      !
      object network INSIDE-NET
       subnet 192.168.28.0 255.255.255.0
       nat (inside,outside1) dynamic interface
      object network INSIDE-NET-BACKUP
       subnet 192.168.28.0 255.255.255.0
       nat (inside,outside2) dynamic interface
      !
      route inside 192.168.28.0 255.255.255.0 192.168.28.241 1
      sla monitor 1
       type echo protocol ipIcmpEcho <ISP1-gw> interface outside1
      track 1 rtr 1 reachability
      route outside1 0.0.0.0 0.0.0.0 <ISP1-gw> 1 track 1
      route outside2 0.0.0.0 0.0.0.0 <ISP2-gw> 254
      !
      router ospf 1
       network 192.168.28.240 255.255.255.248 area 0
       default-information originate
      !
      failover
      failover lan unit primary
      failover lan interface FOVER GigabitEthernet0/3
      failover link FOVER GigabitEthernet0/3
      end

