  type: section
  content:

  # ─────────────────────────────────────────────────────────────────────────
  # РЕФЕРАТ
  # ─────────────────────────────────────────────────────────────────────────
  - type: heading
    level: 0
    text: Реферат

  - type: paragraph
    text: "Курсовая работа: 44 с., {IMAGES_COUNT} рис., {TABLES_COUNT} табл., {SOURCES_COUNT} источников, {APPENDIX_COUNT} приложения."

  - type: paragraph
    text: "КОМПЬЮТЕРНАЯ СЕТЬ, ВИРТУАЛЬНАЯ ЛОКАЛЬНАЯ СЕТЬ, VLAN, ЯДРО СЕТИ, SVI, HSRP, ОТКАЗОУСТОЙЧИВОСТЬ, МЕЖСЕТЕВОЙ ЭКРАН, FAILOVER, ACL, NAT, ДВА ПРОВАЙДЕРА, ЗАЩИТА ИНФОРМАЦИИ, РОЗНИЧНАЯ ТОРГОВЛЯ, КАССОВАЯ ЗОНА, ПЕРСОНАЛЬНЫЕ ДАННЫЕ, CISCO PACKET TRACER."

  - type: paragraph
    text: "Объектом курсовой работы является компьютерная сеть магазина «Альфа-Маркет», расположенного по адресу: г. Энск, ул. Центральная, 1."

  - type: paragraph
    text: "Предметом курсовой работы является проектирование и базовое конфигурирование компьютерной сети предприятия розничной торговли в защищённом исполнении."

  - type: paragraph
    text: "Цель курсовой работы — разработать и реализовать иерархическую отказоустойчивую архитектуру компьютерной сети малого предприятия розничной торговли в защищённом исполнении с применением технологий VLAN, межсегментной маршрутизации на ядре, резервирования шлюзов HSRP, отказоустойчивости межсетевых экранов, резервирования внешнего канала двумя провайдерами, списков контроля доступа и трансляции сетевых адресов."

  - type: paragraph
    text: "В ходе работы проведено предпроектное обследование объекта, разработаны общая, физическая и логические схемы сети уровней L1, L2, L3, составлен IP-план и кабельный журнал, выполнена настройка шести VLAN, межсегментной маршрутизации на SVI ядра с резервированием шлюзов HSRP, маршрута по умолчанию на отказоустойчивую пару межсетевых экранов, серверов WEB, DNS, DHCP и FTP, списков контроля доступа и трансляции адресов с двумя провайдерами в Cisco Packet Tracer, проанализирована защищённость сети."

  - type: paragraph
    text: "Практическая значимость работы — готовность проекта к развёртыванию на действующем предприятии розничной торговли с учётом требований Федерального закона № 152-ФЗ «О персональных данных», Федерального закона № 54-ФЗ «О применении контрольно-кассовой техники» и ГОСТ Р 51303-2023 «Торговля. Термины и определения»."

  # ─────────────────────────────────────────────────────────────────────────
  # СОДЕРЖАНИЕ
  # ─────────────────────────────────────────────────────────────────────────
  - type: heading
    level: 0
    text: Содержание

  # ─────────────────────────────────────────────────────────────────────────
  # ВВЕДЕНИЕ
  # ─────────────────────────────────────────────────────────────────────────
  - type: heading
    level: 0
    text: Введение

  - type: paragraph
    text: "Современный продуктовый магазин сетевого ритейла — это малое предприятие розничной торговли, которое, несмотря на компактный штат, ежедневно обрабатывает значительный массив информации: персональные данные покупателей — участников программы лояльности, персональные данные сотрудников, фискальные данные контрольно-кассовой техники, сведения о товарных запасах и поставках, записи систем видеонаблюдения торгового зала и кассовой зоны, а также данные бухгалтерского и кадрового учёта. По состоянию на 2025–2026 годы Роскомнадзор и ФНС России последовательно ужесточают требования к организациям торговли, обрабатывающим персональные и фискальные данные: положения Федерального закона № 152-ФЗ «О персональных данных» в редакции от 24.06.2025 устанавливают для операторов повышенные требования к защите информации и обязательность реализации технических мер защиты, а Федеральный закон № 54-ФЗ требует обеспечения целостности и сохранности фискальных данных контрольно-кассовой техники."

  - type: paragraph
    text: "Объектом настоящей работы является компьютерная сеть магазина «Альфа-Маркет» (федеральная розничная сеть) в г. Энск по адресу ул. Центральная, 1. Магазин — действующий объект розничной торговли формата «магазин у дома» торговой площадью около 350 квадратных метров, реализующий продовольственные и сопутствующие непродовольственные товары и работающий ежедневно с 08:00 до 23:00. Ежедневно магазин обслуживает до 2500 покупателей; в часы пик одновременно работают до шести кассовых узлов (традиционные кассы и кассы самообслуживания). По характеру деятельности и численности персонала объект относится к категории малых предприятий розничной торговли. Существующие в подобных магазинах локальные сети нередко строятся по упрощённой схеме «единый широковещательный домен плюс кассовый узел», что не соответствует ни современным требованиям регулятора, ни принципам сегментации, изложенным в стандарте ГОСТ Р ИСО/МЭК 27001-2021."

  - type: paragraph
    text: "Актуальность темы определяется необходимостью построения сегментированной и при этом отказоустойчивой компьютерной сети магазина с разграничением трафика кассовой зоны, торгового зала, склада и приёмки товара, службы безопасности и серверной фермы средствами VLAN, межсегментной маршрутизацией на отказоустойчивом ядре, разграничением доступа средствами ACL и контролируемым выходом в Интернет через два независимых канала связи. Для магазина формата «магазин у дома» простой кассовой зоны напрямую означает остановку торговли и утрату выручки, а недоступность канала к оператору фискальных данных — нарушение требований Федерального закона № 54-ФЗ; поэтому одиночные точки отказа (единственное устройство маршрутизации, единственный межсетевой экран, единственный провайдер) недопустимы. Ожидаемый практический эффект — непрерывность торговли и приёма фискальных платежей за счёт резервирования шлюзов по умолчанию протоколом HSRP на двух коммутаторах ядра, отказоустойчивой пары межсетевых экранов в режиме Active/Standby и двух провайдеров с автоматическим переключением, снижение площади поверхности атаки за счёт изоляции широковещательных доменов подразделений, защита фискального контура кассовой зоны от пользовательских сегментов, готовность инфраструктуры к плановой проверке Роскомнадзора и приведение обработки персональных данных покупателей и сотрудников в соответствие требованиям 152-ФЗ и Приказа ФСТЭК России № 21."

  - type: paragraph
    text: "Предметом курсовой работы является проектирование и базовое конфигурирование компьютерной сети предприятия розничной торговли в защищённом исполнении на базе оборудования Cisco в симуляторе Cisco Packet Tracer."

  - type: paragraph
    text: "Целью курсовой работы является разработка архитектуры компьютерной сети магазина розничной торговли в защищённом исполнении и её программная реализация."

  - type: paragraph
    text: "Для достижения поставленной цели сформулированы следующие задачи:"

  - type: list
    items:
    - text: "провести предпроектное обследование объекта информатизации, определить состав подразделений, численность рабочих мест и состав серверов;"
      level: 1
    - text: "разработать общую, физическую и логические схемы сети уровней L1, L2, L3;"
      level: 1
    - text: "составить IP-план сети и таблицу кабельных соединений;"
      level: 1
    - text: "настроить шесть виртуальных локальных сетей (VLAN) с access- и trunk-портами;"
      level: 1
    - text: "настроить межсегментную маршрутизацию на интерфейсах SVI отказоустойчивого ядра и резервирование шлюзов по умолчанию протоколом HSRP, а также динамическую маршрутизацию OSPF между ядром и парой межсетевых экранов;"
      level: 1
    - text: "настроить серверы WEB, DNS, DHCP и FTP, в том числе разрешение доменных имён;"
      level: 1
    - text: "настроить списки контроля доступа (ACL) на ядре и межсетевых экранах и трансляцию сетевых адресов (NAT/PAT) с резервированием внешнего канала двумя провайдерами;"
      level: 1
    - text: "проанализировать защищённость спроектированной сети и выполнить тестирование её работоспособности."
      level: 1

  - type: paragraph
    text: "Курсовая работа состоит из реферата, введения, разделов нормативных ссылок, терминов и определений, сокращений и обозначений, пяти содержательных глав, заключения, списка использованных источников и приложений. В первой главе проводится анализ предметной области и формулируются требования к сети. Вторая глава посвящена проектированию топологии и составлению IP-плана. В третьей главе описывается создание подсистем сети. Четвёртая глава посвящена защищённости сети магазина. В пятой главе приведены результаты тестирования."

  # ─────────────────────────────────────────────────────────────────────────
  # НОРМАТИВНЫЕ ССЫЛКИ
  # ─────────────────────────────────────────────────────────────────────────
