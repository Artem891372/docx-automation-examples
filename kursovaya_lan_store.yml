  - type: heading
    level: 2
    text: Задачи компьютерной сети магазина

  - type: paragraph
    text: "Компьютерная сеть магазина «Альфа-Маркет» решает следующие основные задачи: обеспечение взаимодействия рабочих мест подразделений с товароучётной системой магазина (приёмка товара, учёт остатков, ценообразование, инвентаризация), обеспечение работы кассовой зоны и передачи фискальных данных оператору фискальных данных, обеспечение работы локальных сервисов (внутренний WEB-портал магазина с регламентами и объявлениями, FTP-обмен документами и выгрузками товароучётной системы, динамическая адресация DHCP), обеспечение управляемого доступа сотрудников в Интернет, обеспечение разграничения доступа между подразделениями, обеспечение защиты обрабатываемых персональных данных покупателей и сотрудников, а также фискальной и финансовой информации."

  - type: paragraph
    text: "Дополнительно сеть должна обеспечивать возможность удалённого администрирования сетевого оборудования из сегмента ИТ, изолированность фискального контура кассовой зоны и подсистемы видеонаблюдения/СКУД от прочего пользовательского трафика, отображение актуальных цен на электронных ценниках торгового зала, а также выгрузку отчётов и резервных копий товароучётной системы на FTP-сервер. Перечисленные задачи отражают типовые требования к сетевой инфраструктуре малого предприятия розничной торговли [5, 6]."

  - type: paragraph
    text: "Все рабочие места магазина должны иметь возможность обращаться к локальному WEB-серверу для просмотра внутренних регламентов, прайс-листов и объявлений, к FTP-серверу для обмена документами и выгрузками товароучётной системы и к серверу DHCP для автоматической конфигурации сетевых параметров. Внутренний WEB-сервер должен разрешать доменные имена через локальный DNS-сервер, что позволит обращаться к ресурсам по имени, а не по IP-адресу [1]."

  - type: heading
    level: 2
    text: Требования к сети и обоснование топологии

  - type: paragraph
    text: "Исходя из задач сети и параметров варианта 9, сформулированы следующие требования к проектируемой компьютерной сети магазина. Сеть должна включать шесть виртуальных локальных сетей (VLAN) — по одной на каждое функциональное подразделение магазина. Минимальное число рабочих мест в одной VLAN — шесть. Адресное пространство сети — частная подсеть 192.168.28.0/24 в соответствии с RFC 1918 [10]. Помимо функциональных требований к сети предъявляются нефункциональные требования отказоустойчивости: непрерывность работы кассовой зоны и передачи фискальных данных, отсутствие одиночных точек отказа на пути от рабочего места до внешнего канала связи, автоматическое восстановление связности при выходе из строя любого одного устройства ядра, межсетевого экрана или канала провайдера за время, не нарушающее обслуживание покупателей."

  - type: paragraph
    text: "Для удовлетворения этих требований топология сети магазина строится по иерархической отказоустойчивой модели, рекомендуемой Cisco [9], с дублированием оборудования на каждом критичном уровне. Уровень доступа образуют коммутаторы доступа (три коммутатора пользовательских VLAN UsersSW1–UsersSW3 и пара коммутаторов серверного сегмента SrvSW1/SrvSW2), к которым подключены рабочие места и серверы. Уровень ядра (распределения) образуют два коммутатора уровня L3 CoreSW1 и CoreSW2 (Cisco Catalyst 3750-X), на которых выполняется межсегментная маршрутизация на интерфейсах SVI; шлюзом по умолчанию каждой VLAN служит виртуальный адрес протокола HSRP, разделяемый двумя коммутаторами ядра, что обеспечивает резервирование шлюза при отказе одного из них. Периметр сети образует отказоустойчивая пара межсетевых экранов Cisco ASA (FW1/FW2) в режиме Active/Standby (failover), выполняющая фильтрацию межсетевого трафика и трансляцию адресов наружу. Внешние каналы вводятся через пограничный коммутатор OutsideSW (Cisco Catalyst 1000), агрегирующий вводы двух провайдеров — ISP1 (Ростелеком) и ISP2 (МТС)."

  - type: paragraph
    text: "Такая трёхуровневая иерархия с дублированием обеспечивает масштабируемость, упрощает локализацию сбоев и реализует сегментацию трафика на уровне VLAN, одновременно исключая одиночные точки отказа: при выходе из строя одного коммутатора ядра шлюзы VLAN продолжают обслуживаться вторым через HSRP; при отказе активного межсетевого экрана трафик подхватывает резервный по механизму failover; при потере основного канала ISP1 выход в Интернет переключается на резервный канал ISP2. Распределение функций между устройствами проектируемой сети приведено в таблице {ref:tbl_lans}."

