  - type: paragraph
    text: "Выбор оборудования продиктован задачами курсового проектирования и возможностями симулятора Cisco Packet Tracer [1]: коммутаторы ядра Cisco Catalyst 3750-X (многоуровневые коммутаторы L3 с поддержкой SVI и HSRP), межсетевые экраны Cisco ASA 5500 (поддержка failover, NAT/PAT и межсетевых ACL), коммутаторы доступа Cisco Catalyst 2960 (24 порта с поддержкой VLAN и Port Security), пограничный коммутатор Cisco Catalyst 1000. Перечисленные модели образуют типовую отказоустойчивую архитектуру предприятия и достаточны для решения задач, поставленных перед сетью магазина."

  - type: heading
    level: 2
    text: Анализ существующих решений

  - type: paragraph
    text: "На рынке сетевого оборудования для построения корпоративных сетей малых и средних предприятий представлены несколько ключевых производителей: Cisco Systems, MikroTik, Eltex, Hewlett Packard Enterprise (HPE Aruba). Для выбора решения, соответствующего задачам предприятия розничной торговли, проведён сравнительный анализ предложений по совокупности факторов: поддержка VLAN, поддержка ACL и NAT, наличие централизованного управления, доступность и стоимость лицензий, наличие сертификатов соответствия требованиям ФСТЭК России. Результаты сравнения приведены в таблице {ref:tbl_vendors}."

