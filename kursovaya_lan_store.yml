  # ─────────────────────────────────────────────────────────────────────────
  # ТЕРМИНЫ И ОПРЕДЕЛЕНИЯ
  # ─────────────────────────────────────────────────────────────────────────
  - type: heading
    level: 1
    text: Термины и определения

  - type: paragraph
    text: "В настоящей работе применяются следующие термины с соответствующими определениями."

  - type: paragraph
    text: "Розничная торговля — вид торговой деятельности, связанный с приобретением и продажей товаров для использования их в личных, семейных, домашних и иных целях, не связанных с осуществлением предпринимательской деятельности (ГОСТ Р 51303-2023)."

  - type: paragraph
    text: "Магазин «у дома» — предприятие розничной торговли, расположенное в шаговой доступности от мест проживания покупателей, реализующее преимущественно продовольственные товары повседневного спроса при ограниченной торговой площади."

  - type: paragraph
    text: "Контрольно-кассовая техника (ККТ) — программно-аппаратное средство, обеспечивающее регистрацию и передачу фискальных данных о расчётах в налоговые органы через оператора фискальных данных в соответствии с Федеральным законом № 54-ФЗ."

  - type: paragraph
    text: "Локальная вычислительная сеть (ЛВС) — компьютерная сеть, связывающая компьютеры в пределах одного или нескольких смежных зданий и позволяющая нескольким компьютерам совместно использовать ресурсы и подключаться к Интернету через единую точку доступа."

  - type: paragraph
    text: "Виртуальная локальная сеть (VLAN, Virtual Local Area Network) — группа устройств, имеющих возможность взаимодействовать между собой напрямую на канальном уровне, хотя физически они могут быть подключены к разным сетевым коммутаторам; каждый VLAN образует отдельный широковещательный домен."

  - type: paragraph
    text: "Access-порт — порт коммутатора, принадлежащий одному VLAN и передающий нетегированный трафик; используется для подключения конечных устройств."

  - type: paragraph
    text: "Trunk-порт — порт коммутатора, передающий тегированный трафик одного или нескольких VLAN; используется для соединения коммутаторов между собой и с маршрутизаторами."

  - type: paragraph
    text: "Маршрутизатор — сетевое устройство уровня L3 модели OSI, пересылающее пакеты между логическими сегментами сети на основании таблицы маршрутизации."

  - type: paragraph
    text: "Коммутатор доступа (ASW, Access Switch) — коммутатор, к которому подключены конечные устройства пользователей и серверы."

  - type: paragraph
    text: "IP-адрес — уникальный сетевой адрес узла в компьютерной сети, построенной по протоколу IP."

  - type: paragraph
    text: "Маска подсети — битовая маска, определяющая, какая часть IP-адреса узла относится к адресу сети, а какая — к адресу самого узла."

  - type: paragraph
    text: "Список контроля доступа (ACL, Access Control List) — упорядоченный набор правил, определяющих условия пропуска или отбрасывания сетевых пакетов на интерфейсе сетевого устройства."

  - type: paragraph
    text: "Трансляция сетевых адресов (NAT, Network Address Translation) — технология преобразования IP-адресов и портов в заголовках сетевых пакетов, обеспечивающая взаимодействие узлов локальной сети с частными адресами и узлов глобальной сети с публичными адресами."

  - type: paragraph
    text: "Защищённое исполнение — реализация компьютерной сети с применением комплекса организационных и технических мер, обеспечивающих сегментацию трафика, разграничение доступа, контроль входящего и исходящего трафика и защиту обрабатываемых персональных данных покупателей и сотрудников, а также фискальных данных кассовой зоны."

