  # СОКРАЩЕНИЯ И ОБОЗНАЧЕНИЯ
  # ─────────────────────────────────────────────────────────────────────────
  - type: heading
    level: 1
    text: Сокращения и обозначения

  - type: list
    style: numbered_dot
    items:
