    text: "Поэтажный план магазина «Альфа-Маркет» по адресу г. Энск, ул. Центральная, 1, с указанием размещения рабочих мест и активного сетевого оборудования приведён на рисунке {ref:fig_floor} (план выполнен в векторной графике с архитектурными элементами — капитальные стены, перегородки, дверные проёмы с указанием направления открывания и оконные проёмы). План составлен в условном масштабе. Помещение магазина организовано в соответствии с типовой схемой предприятия розничной торговли формата «магазин у дома»: кассовая зона у главного входа отделена от торгового зала, складско-приёмочной зоны с разгрузочной рампой, кабинетов администрации, поста охраны и серверной. Каждая зона соответствует отдельной VLAN согласно IP-плану (таблица {ref:tbl_ip})."

