  # ─────────────────────────────────────────────────────────────────────────
  # ГЛАВА 2. ПРОЕКТИРОВАНИЕ СЕТИ
  # ─────────────────────────────────────────────────────────────────────────
  - type: heading
    level: 1
    text: Проектирование сети
    id: ch_design

  - type: heading
    level: 2
    text: Разработка общей схемы сети

  - type: paragraph
    text: "Проектирование сети магазина «Альфа-Маркет» выполнялось по принципу «от общего к частному»: от структурной (общей) схемы сети — к схемам канального и сетевого уровней, IP-плану и таблице кабельных соединений [11]. Такой подход согласуется с лучшими практиками документирования компьютерных сетей и позволяет последовательно конкретизировать архитектурные решения."

  - type: paragraph
    text: "Общая (структурная) схема сети представляет верхний уровень абстракции и отражает принципиальные моменты архитектуры: уровни иерархии, дублирование оборудования, наличие двух провайдеров и серверной фермы, общую логику подключения. На общей схеме намеренно опускаются детали уровней L1 и L2 (номера портов, идентификаторы VLAN, типы кабелей) — они отражаются на специализированных схемах в подразделах 2.4 и далее [11]. Общая схема проектируемой сети магазина приведена на рисунке {ref:fig_overview} (выполнена в нотации стенсилов Cisco средствами draw.io)."

  - type: image
    image:
      path: images/lan_struct.png
      width_in: 6.0
  - type: figure_caption
    text: Структурная схема ЛВС магазина «Альфа-Маркет»
    id: fig_overview

  - type: paragraph
    text: "На структурной схеме отражены четыре уровня архитектуры. Сверху расположены два провайдера — ISP1 (Ростелеком) как основной и ISP2 (МТС) как резервный, вводы которых агрегирует пограничный коммутатор OutsideSW. Периметр образует отказоустойчивая пара межсетевых экранов FW1/FW2 (Cisco ASA) в режиме Active/Standby: один экран обрабатывает трафик, второй синхронизирует состояние сессий и подхватывает работу при отказе. Ядро сети образуют два коммутатора L3 — CoreSW1 и CoreSW2, на которых выполняется межсегментная маршрутизация на интерфейсах SVI; шлюзом каждой VLAN служит виртуальный адрес HSRP, разделяемый обоими коммутаторами ядра. К ядру подключены коммутаторы доступа: пара SrvSW1/SrvSW2 для серверного сегмента (VLAN 80) и три коммутатора UsersSW1–UsersSW3 для пользовательских VLAN подразделений."

  - type: paragraph
    text: "Серверная ферма WEB / DNS / DHCP / FTP размещена в выделенном VLAN серверов (VLAN 80) и подключена к паре коммутаторов SrvSW1/SrvSW2; такое размещение типично для малых предприятий розничной торговли, обеспечивает физическую близость серверов к ИТ-персоналу при минимальной длине кабельных соединений [4] и резервирует подключение серверов на двух коммутаторах. Связь ядра с периметром реализована транзитной подсетью «ядро–межсетевой экран» 192.168.28.240/29, не пересекающейся с пользовательскими VLAN. Выделение серверного сегмента в отдельный VLAN, отдельный от пользовательских VLAN администрации, соответствует требованию изоляции серверного сегмента [8, 12]."

  - type: heading
    level: 2
    text: Разработка физической схемы

  - type: paragraph
    text: "Физическая схема сети отражает размещение рабочих мест, активного и пассивного сетевого оборудования в реальных помещениях магазина, а также компоновку оборудования в монтажном шкафу. Магазин «Альфа-Маркет» занимает встроенно-пристроенное помещение на первом этаже жилого дома по адресу ул. Центральная, 1. Всё активное сетевое оборудование централизованно монтируется в один напольный телекоммуникационный шкаф 19 дюймов «Р1-Ш1», размещённый в серверной. Состав помещений и размещение оборудования приведены в таблице {ref:tbl_rooms}."

  - type: table
    caption: Размещение рабочих мест и оборудования по помещениям магазина
    id: tbl_rooms
    data:
    - ["Зона", "Помещение", "Размещаемое оборудование", "VLAN"]
    - ["Кассовая", "Кассовая зона (линия касс)", "Кассовые АРМ и POS-терминалы, абонентские линии до Р1-Ш1", "20"]
    - ["Торговая", "Торговый зал", "АРМ мерчандайзеров, оператор электронных ценников", "30"]
    - ["Складская", "Склад и зона приёмки товара", "АРМ кладовщиков и приёмки, терминалы сбора данных", "40"]
    - ["Охранная", "Пост охраны / видеонаблюдение", "АРМ службы безопасности, видеорегистратор, СКУД", "60"]
    - ["Управленческая", "Кабинеты администрации", "АРМ директора, товароведов и бухгалтерии", "10"]
    - ["Техническая", "Серверная (шкаф Р1-Ш1)", "OutsideSW, FW1/FW2, CoreSW1/CoreSW2, SrvSW1/SrvSW2, UsersSW1–3, серверы WEB/DNS/DHCP/FTP, патч-панели, ИБП", "80"]

  - type: paragraph
    text: "Серверная — выделенное помещение с ограниченным физическим доступом, оборудованное замком и интегрированное с системой контроля и управления доступом (СКУД), системой кондиционирования и источником бесперебойного питания. Всё активное оборудование монтируется в один напольный шкаф 19 дюймов «Р1-Ш1» высотой 22U сверху вниз: вводные патч-панели провайдеров, пограничный коммутатор OutsideSW, пара межсетевых экранов FW1/FW2, пара коммутаторов ядра CoreSW1/CoreSW2, коммутаторы серверного сегмента SrvSW1/SrvSW2, коммутаторы доступа UsersSW1–UsersSW3, горизонтальные патч-панели абонентских линий, серверы WEB/DNS/DHCP/FTP, организаторы кабеля и блок ИБП в нижней части. Запас юнитов обеспечивает дальнейшее расширение [4]. Компоновка шкафа приведена ниже на схеме физического уровня (подраздел 2.4)."

  - type: paragraph
    text: "Кабельная инфраструктура магазина построена как структурированная кабельная система (СКС). Горизонтальная подсистема — абонентские линии от рабочих мест и серверов до патч-панелей шкафа Р1-Ш1 — выполняется медным кабелем «витая пара» U/UTP категории не ниже 5e с разъёмами RJ-45 (обжим по схеме T568B). Магистральные связи внутри шкафа между коммутаторами ядра, серверными коммутаторами и межсетевыми экранами выполняются оптическими патч-кордами с разъёмами LC по многомодовому волокну, что обеспечивает гигабитную пропускную способность магистралей и гальваническую развязку. Вводы провайдеров заводятся на отдельные патч-панели. Применение СКС соответствует стандартам структурированных кабельных систем и упрощает эксплуатацию и расширение сети [4, 11]."

  - type: paragraph
    text: "Полная физическая схема магазина с указанием размеров помещений, расположения рабочих мест и трасс кабельных соединений приведена в Приложении А; компоновка шкафа Р1-Ш1 — на рисунке схемы физического уровня L1 (подраздел 2.4). Полный кабельный журнал СКС приведён в Приложении Г (рисунки Г.1–Г.3)."

  - type: heading
    level: 2
    text: Разработка логической структурной схемы ЛВС

  - type: paragraph
    text: "Логическая структурная схема ЛВС отражает организацию сети с точки зрения функциональных блоков и логических связей между ними, без привязки к физическому размещению. По составу узлов структурная схема совпадает с общей схемой сети (рисунок {ref:fig_overview}): на ней показаны два провайдера, пограничный коммутатор OutsideSW, отказоустойчивая пара межсетевых экранов FW1/FW2, два коммутатора ядра CoreSW1/CoreSW2 с маршрутизацией на SVI и шлюзами HSRP, а также коммутаторы доступа — пара серверного сегмента SrvSW1/SrvSW2 и три пользовательских коммутатора UsersSW1–UsersSW3. К коммутаторам доступа подключены рабочие места соответствующих VLAN и серверная ферма; детальная роспись портов отражается на схеме физического уровня (подраздел 2.4)."

  - type: paragraph
    text: "Реализация структурной схемы в среде Cisco Packet Tracer представлена на рисунке {ref:fig_cpt_topology}. На рабочем пространстве размещены все 33 рабочих места подразделений (подписаны последним октетом IP-адреса), 4 сервера (WEB, DNS, DHCP, FTP), два многоуровневых коммутатора ядра, пара межсетевых экранов, пограничный коммутатор и коммутаторы доступа. Подключения выполнены в соответствии с кабельным журналом (Приложение Г)."

  - type: image
    image:
      path: images/cpt_topology.png
      width_in: 6.5
  - type: figure_caption
    text: Схема компьютерной сети магазина в программе Cisco Packet Tracer
    id: fig_cpt_topology

  - type: heading
    level: 2
    text: Разработка теоретических схем L1, L2, L3

  - type: paragraph
    text: "В соответствии с лучшими практиками документирования компьютерных сетей [11] для каждой проектируемой сети должны быть подготовлены три специализированные схемы — L1, L2 и L3. Схема L1 отражает физический уровень и показывает физические устройства с номерами портов и физические соединения. Схема L2 отражает канальный уровень и показывает подключение устройств по VLAN, режим портов (access или trunk) и идентификаторы VLAN на транковых соединениях. Схема L3 отражает сетевой уровень и показывает логические сегменты сети с указанием подсети, идентификатора VLAN и адреса шлюза по умолчанию."

  - type: heading
    level: 3
    text: Схема физического уровня L1

  - type: paragraph
    text: "Схема физического уровня L1 проектируемой сети магазина приведена на рисунке {ref:fig_l1} (выполнена средствами draw.io). На схеме L1 отражены физические подключения активного оборудования с указанием конкретных портов и типа линий: восходящие связи пользовательских коммутаторов UsersSW1–UsersSW3 и серверных коммутаторов SrvSW1/SrvSW2 к обоим коммутаторам ядра CoreSW1/CoreSW2, межкоммутаторный канал ядра, подключение рабочих мест подразделений и серверов к access-портам, а также стыки периметра — пограничный коммутатор OutsideSW, межсетевые экраны FW1/FW2 и маршрутизаторы провайдеров. Абонентские линии рабочих мест выполнены медной витой парой U/UTP cat 5e с разъёмами RJ-45 (схема T568B), магистральные связи ядра и серверов — оптическими патч-кордами LC. В отличие от схем L2 и L3, отражающих логическую организацию сети, схема L1 служит основой для монтажных работ и кабельного журнала [11]."

  - type: image
    image:
      path: images/lan_l1.png
      width_in: 6.0
  - type: figure_caption
    text: Схема физического уровня L1 (подключения и порты доступа)
    id: fig_l1

  - type: paragraph
    text: "Компоновка активного оборудования в монтажном телекоммуникационном шкафу 19 дюймов «Р1-Ш1» приведена на рисунке {ref:fig_rack}. На физическом уровне магистральные связи между парой коммутаторов ядра, межсетевыми экранами и серверными коммутаторами выполнены оптическими патч-кордами с разъёмами LC по многомодовому волокну, что обеспечивает гигабитную пропускную способность ядра и резервирование линков. Горизонтальная подсистема СКС — абонентские линии от рабочих мест и серверов до горизонтальных патч-панелей шкафа — выполнена медной витой парой U/UTP cat 5e с разъёмами RJ-45 (схема T568B). Вводы провайдеров ISP1 и ISP2 заводятся на отдельные вводные патч-панели и подключаются к пограничному коммутатору OutsideSW. Каждый межсетевой экран и каждый коммутатор ядра подключены двумя линиями (к OutsideSW сверху и к соседнему устройству пары), что исключает одиночную точку отказа на физическом уровне."

  - type: image
    image:
      path: images/lan_rack.png
      width_in: 6.5
  - type: figure_caption
    text: Компоновка оборудования в монтажном шкафу 19 дюймов «Р1-Ш1»
    id: fig_rack

  - type: heading
    level: 3
    text: Схема канального уровня L2

  - type: paragraph
    text: "Схема канального уровня L2 проектируемой сети магазина приведена на рисунке {ref:fig_l2}. На схеме отражены идентификаторы VLAN, передаваемые через каждое физическое соединение, и режим работы порта (access или trunk). Транковые порты передают тегированный трафик нескольких VLAN; access-порты передают нетегированный трафик одной VLAN, к которой принадлежит подключённое конечное устройство [9]."

  - type: image
    image:
      path: images/lan_l2.png
      width_in: 6.5
  - type: figure_caption
    text: Схема канального уровня L2
    id: fig_l2

  - type: paragraph
    text: "На схеме L2 видно, что коммутаторы доступа (SrvSW1/SrvSW2 и UsersSW1–UsersSW3) связаны с обоими коммутаторами ядра CoreSW1 и CoreSW2 транковыми портами, по которым передаются все пользовательские и серверный VLAN. Между двумя коммутаторами ядра организован транковый межкоммутаторный канал, по которому помимо пользовательских VLAN передаётся служебный трафик протокола HSRP (определение активного и резервного шлюза для каждой VLAN). Access-порты коммутаторов доступа сопоставлены с конкретными VLAN подразделений (например, порты UsersSW1, обслуживающего кассовую зону, — access-порты VLAN 20). Сегмент серверов VLAN 80 подключён к паре SrvSW1/SrvSW2, что резервирует подключение серверов на канальном уровне. Связь ядра с межсетевыми экранами FW1/FW2 организована в транзитной подсети «ядро–межсетевой экран» вне пользовательских VLAN."

  - type: heading
    level: 3
    text: Схема сетевого уровня L3

  - type: paragraph
    text: "Схема сетевого уровня L3 проектируемой сети магазина приведена на рисунке {ref:fig_l3}. На схеме отражены логические сегменты сети — VLAN, преобразованные в IP-подсети — с указанием идентификатора VLAN, диапазона IP-адресов и адреса шлюза по умолчанию. Оборудование уровня L2 (коммутаторы доступа и распределения) на схеме L3 не отображается, что соответствует общепринятой практике документирования сетей [11]."

  - type: image
    image:
      path: images/lan_l3.png
      width_in: 6.5
  - type: figure_caption
    text: Схема сетевого уровня L3
    id: fig_l3

  - type: paragraph
    text: "На схеме L3 видно, что каждой VLAN сопоставлена отдельная IP-подсеть размером /28 (16 адресов, из которых 14 доступны для назначения хостам). Адресация выбрана из частного диапазона 192.168.28.0/24 в соответствии с RFC 1918 [10]. Шлюзом по умолчанию каждой VLAN служит виртуальный адрес HSRP (например, 192.168.28.1 для VLAN 10), общий для интерфейсов SVI обоих коммутаторов ядра CoreSW1 и CoreSW2: при отказе активного коммутатора виртуальный адрес шлюза подхватывает резервный, поэтому конечные устройства не теряют связности и не требуют переконфигурирования. Связь ядра с парой межсетевых экранов FW1/FW2 реализована транзитной подсетью «ядро–межсетевой экран» 192.168.28.240/29; маршрут по умолчанию ядро получает динамически по протоколу OSPF от межсетевого экрана, а с межсетевых экранов трафик направляется в два внешних канала — основной ISP1 и резервный ISP2. VLAN 80 (192.168.28.112/28) служит подсетью серверной фермы и ИТ-отдела (WEB — .114, DNS — .115, DHCP — .116, FTP — .117, ИТ-АРМ — .118–.126), что соответствует требованию изоляции серверного сегмента [8, 12]."

  - type: heading
    level: 2
    text: Составление IP-плана

  - type: paragraph
    text: "IP-план сети — документ, в котором каждому устройству и каждому логическому сегменту сети сопоставлены диапазон IP-адресов, маска подсети и адрес шлюза по умолчанию. Формирование IP-плана выполняется до начала практического конфигурирования оборудования, что позволяет избежать конфликтов адресации и обеспечить единообразное распределение адресного пространства [11]."

  - type: paragraph
    text: "В качестве адресного пространства проектируемой сети магазина выбрана частная подсеть 192.168.28.0/24 (256 адресов), соответствующая варианту 9 индивидуального задания. Поскольку максимальное число рабочих мест в одной VLAN — шесть, для каждой VLAN подразделений выделена подсеть размером /28 (16 адресов, до 14 хостов на VLAN), что обеспечивает запас для расширения штата. Серверная ферма и ИТ-отдел размещены в VLAN 80 (192.168.28.112/28). Связь ядра с парой межсетевых экранов реализована транзитной подсетью «ядро–межсетевой экран» 192.168.28.240/29 (две точки соединения). Распределение адресного пространства приведено в таблице {ref:tbl_ip}."

  - type: table
    caption: IP-план проектируемой сети магазина
    id: tbl_ip
    data:
    - ["VLAN", "Назначение", "Подсеть", "Шлюз (HSRP на ядре)", "Диапазон хостов"]
    - ["10", "Администрация", "192.168.28.0/28", "192.168.28.1", "192.168.28.2 — 192.168.28.14"]
    - ["20", "Кассовая зона (ККТ)", "192.168.28.16/28", "192.168.28.17", "192.168.28.18 — 192.168.28.30"]
    - ["30", "Торговый зал", "192.168.28.32/28", "192.168.28.33", "192.168.28.34 — 192.168.28.46"]
    - ["40", "Склад и приёмка", "192.168.28.48/28", "192.168.28.49", "192.168.28.50 — 192.168.28.62"]
    - ["60", "Служба безопасности", "192.168.28.80/28", "192.168.28.81", "192.168.28.82 — 192.168.28.94"]
    - ["80", "Серверы и ИТ", "192.168.28.112/28", "192.168.28.113", "WEB .114; DNS .115; DHCP .116; FTP .117; ИТ .118–.126"]
    - ["—", "Транзит ядро↔МЭ", "192.168.28.240/29", "—", "ядро (HSRP) .241/.242, МЭ .243"]

  - type: paragraph
    text: "Адреса конечных рабочих мест в каждой VLAN назначаются последовательно начиная с .2 от начала подсети (адрес .1 зарезервирован под виртуальный шлюз HSRP). Так, в VLAN 10 (Администрация) адреса .2–.7 присвоены рабочим местам Director, Deputy, Merch-1, Merch-2, Acc-1, Acc-2 соответственно. В VLAN 20 (Кассовая зона) адреса .18..23 присвоены кассовым рабочим местам Cashier-1..Cashier-6. Аналогичный принцип применён ко всем пользовательским VLAN. Серверы WEB, DNS, DHCP, FTP получают статические адреса 192.168.28.114, 192.168.28.115, 192.168.28.116, 192.168.28.117 соответственно — они размещены в подсети VLAN 80 (192.168.28.112/28), рабочие места ИТ-отдела получают адреса .118–.126. Шлюзом по умолчанию каждой VLAN служит виртуальный адрес HSRP (.1 — для VLAN 10, .17 — для VLAN 20 и т. д.), общий для интерфейсов SVI обоих коммутаторов ядра."

  - type: paragraph
    text: "В транзитной подсети «ядро–межсетевой экран» 192.168.28.240/29 интерфейсам ядра выделены адреса .241 (CoreSW1) и .242 (CoreSW2), межсетевому экрану — виртуальный адрес failover .243, на который ядро направляет исходящий трафик. Доступ к административным интерфейсам коммутаторов и межсетевых экранов ограничивается ACL — управление разрешено только из VLAN 80 (ИТ-отдел), что соответствует требованию изоляции каналов управления оборудованием [8, 12]."

  - type: paragraph
    text: "Распределение адресного пространства выполнено по методу VLSM (Variable Length Subnet Mask — маска подсети переменной длины) по принципу «от больших сетей к меньшим»: пул 192.168.28.0/24 последовательно делится на блоки, начиная с подразделений с наибольшим числом узлов, что исключает фрагментацию адресного пространства и оставляет верхнюю часть пула под транзитные и служебные подсети. Поскольку максимальное число рабочих мест в одной VLAN не превышает шести, для каждого подразделения достаточно подсети /28 (16 адресов), при этом единый размер /28 принят для всех пользовательских VLAN ради единообразия IP-плана и упрощения эксплуатации. Запас адресов в каждой подсети рассчитывается как размер сети за вычетом двух служебных адресов (адреса сети и широковещательного) и числа узлов: запас = размер_сети − 2 − узлы. Результаты распределения подсетей приведены в таблице {ref:tbl_subnets}."

  - type: paragraph
    text: "В таблице {ref:tbl_subnets} для каждого подразделения указаны количество узлов, размер выделенной сети, адрес подсети и остающийся запас адресов под расширение штата. Минимальный запас (6 адресов) приходится на сегмент ИТ и серверов (VLAN 80), объединяющий четыре сервера и четыре рабочих места ИТ-отдела; для пользовательских подразделений запас составляет 8 адресов, что обеспечивает резерв на рост числа рабочих мест."

  - type: table
    caption: Распределение подсетей по методу VLSM
    id: tbl_subnets
    data:
    - ["Подразделение", "Количество узлов", "Размер сети", "Сеть", "Запас"]
    - ["Администрация (VLAN 10)", "6", "16", "192.168.28.0/28", "8"]
    - ["Кассовая зона (VLAN 20)", "6", "16", "192.168.28.16/28", "8"]
    - ["Торговый зал (VLAN 30)", "6", "16", "192.168.28.32/28", "8"]
    - ["Склад и приёмка (VLAN 40)", "6", "16", "192.168.28.48/28", "8"]
    - ["Служба безопасности (VLAN 60)", "6", "16", "192.168.28.80/28", "8"]
    - ["Серверы и ИТ (VLAN 80)", "8", "16", "192.168.28.112/28", "6"]

  - type: paragraph
    text: "Назначение IP-адресов рабочим местам в Cisco Packet Tracer выполняется через вкладку «Desktop» в меню «IP Configuration» (рисунок {ref:fig_cpt_ip}). На примере рабочего места Director видно: IP-адрес 192.168.28.2, маска подсети 255.255.255.240, шлюз 192.168.28.1 (виртуальный адрес HSRP интерфейсов SVI VLAN 10 на ядре), DNS-сервер 192.168.28.115. Аналогичная процедура выполняется для каждого ПК в соответствии с IP-планом (таблица {ref:tbl_ip})."

  - type: image
    image:
      path: images/cpt_ip_config.png
      width_in: 5.5
  - type: figure_caption
    text: Назначение IP-адреса рабочему месту Director
    id: fig_cpt_ip

  - type: heading
    level: 2
    text: Таблица кабельных соединений
    id: sec_cable

  - type: paragraph
    text: "Таблица кабельных соединений (кабельный журнал) — оперативный документ инженера структурированной кабельной системы, отражающий все кабельные подключения активного оборудования по портам. Журнал позволяет восстановить топологию сети по физическим соединениям, рассчитать спецификацию кабелей и патч-кордов, подготовить наряд на монтажные работы [4, 11]. Кабельный журнал проектируемой сети оформлен по типовой форме и содержит маркировку линий, точки подключения «откуда»/«куда» (ряд-шкаф-юнит, оборудование, порт), промежуточные кросс-коннекты на патч-панелях, тип разъёма, число и длину кусков, общую длину и примечания."

  - type: paragraph
    text: "Кабельный журнал сгруппирован по подсистемам структурированной кабельной системы. В первую группу входят вводы провайдеров ISP1 и ISP2, магистральные оптические линии ядра (CoreSW1↔CoreSW2, ядро↔межсетевые экраны) и подключение серверных коммутаторов; магистрали выполнены оптическими патч-кордами с разъёмами LC, что обеспечивает гигабитную пропускную способность и резервирование линков. Вторую группу образуют абонентские линии рабочих мест и серверов по VLAN — медная витая пара U/UTP cat 5e с разъёмами RJ-45, разведённая через горизонтальные патч-панели шкафа Р1-Ш1 (схема T568B). Компоновка шкафа задаёт распределение устройств по юнитам и точки кросс-коннектов. Полный кабельный журнал структурированной кабельной системы приведён в Приложении Г (рисунки Г.1–Г.3)."

  # ─────────────────────────────────────────────────────────────────────────
  # ГЛАВА 3. СОЗДАНИЕ ПОДСИСТЕМ СЕТИ
  # ─────────────────────────────────────────────────────────────────────────
  - type: heading
    level: 1
    text: Создание подсистем сети
    id: ch_subsystems

  - type: paragraph
    text: "Практическая реализация спроектированной сети выполнена в симуляторе Cisco Packet Tracer [1]. Реализация разбита на пять подсистем, каждая из которых отвечает за свою функциональную область сети: подсистема коммутации и виртуальных локальных сетей (VLAN), подсистема маршрутизации, подсистема серверов, подсистема разграничения доступа (ACL), подсистема трансляции сетевых адресов (NAT). Подсистемы реализуются последовательно: сначала на канальном уровне (VLAN), затем на сетевом (маршрутизация), затем на прикладном (серверы) и далее — подсистемы безопасности (ACL и NAT), требующие наличия маршрутизации между сегментами."

  - type: heading
    level: 2
    text: Подсистема коммутации и виртуальных локальных сетей

  - type: paragraph
    text: "Подсистема коммутации и VLAN реализует канальный уровень проектируемой сети и обеспечивает разделение единого широковещательного домена на шесть логических сегментов подразделений и серверный сегмент. Технология VLAN регламентирована стандартом IEEE 802.1Q и поддерживается всеми современными управляемыми коммутаторами [2, 9]. Каждая VLAN образует отдельный широковещательный домен, что повышает производительность сети, снижает уровень фоновых широковещательных рассылок и обеспечивает изоляцию трафика подразделений на канальном уровне. Все шесть VLAN (10, 20, 30, 40, 60, 80) создаются на обоих коммутаторах ядра CoreSW1 и CoreSW2 и на коммутаторах доступа, к портам которых подключены устройства соответствующих сегментов."

  - type: paragraph
    text: "В Cisco IOS используется следующая терминология портов коммутатора. Access-порт — порт, принадлежащий одному VLAN и передающий нетегированный трафик; access-порт может принадлежать только одному VLAN; любой кадр, проходящий через access-порт, помечается номером VLAN, к которому принадлежит порт. Trunk-порт — порт, передающий тегированный трафик одного или нескольких VLAN; trunk-порт не изменяет тег, а лишь пропускает кадры с тегами, разрешёнными на этом порту. Порты, в которые подключены конечные устройства (рабочие места и серверы), настраиваются как access; межкоммутаторные связи (коммутаторы доступа — ядро, CoreSW1 — CoreSW2) — как trunk [9]."

  - type: paragraph
    text: "Создание VLAN на коммутаторе выполняется командой `vlan <id>` с переходом в режим конфигурации VLAN, в котором задаётся имя VLAN. Пример последовательности команд для создания пользовательской VLAN кассовой зоны и серверной VLAN на коммутаторе доступа UsersSW1 приведён в листинге {ref:lst_vlan}."

  - type: code
    caption: Создание VLAN на коммутаторе доступа UsersSW1
    id: lst_vlan
    code: |
      Switch>enable
      Switch#configure terminal
      Switch(config)#hostname UsersSW1
      UsersSW1(config)#vlan 20
      UsersSW1(config-vlan)#name Cashzone
      UsersSW1(config-vlan)#exit
      UsersSW1(config)#vlan 10
      UsersSW1(config-vlan)#name Admin
      UsersSW1(config-vlan)#exit

  - type: paragraph
    text: "После создания VLAN access-порты сопоставляются с конкретными VLAN подразделений, а порты восходящих связей к обоим коммутаторам ядра настраиваются как trunk с пропуском нужных VLAN. Пример настройки портов коммутатора UsersSW1 (обслуживает кассовую зону) приведён в листинге {ref:lst_ports}: порты fa0/1..fa0/6 — access в VLAN 20, два восходящих порта Gi0/1 и Gi0/2 — trunk к CoreSW1 и CoreSW2 соответственно, что резервирует подключение коммутатора доступа к ядру."

  - type: code
    caption: Настройка access- и trunk-портов коммутатора доступа UsersSW1
    id: lst_ports
    code: |
      UsersSW1(config)#interface range fa0/1 - 6
      UsersSW1(config-if-range)#switchport mode access
      UsersSW1(config-if-range)#switchport access vlan 20
      UsersSW1(config-if-range)#description Cashier-PCs
      UsersSW1(config-if-range)#exit
      UsersSW1(config)#interface range gi0/1 - 2
      UsersSW1(config-if-range)#switchport mode trunk
      UsersSW1(config-if-range)#switchport trunk allowed vlan 10,20,30,40,60,80
      UsersSW1(config-if-range)#description Uplink-to-Core
      UsersSW1(config-if-range)#end
      UsersSW1#write memory

  - type: paragraph
    text: "Аналогичная последовательность команд применяется к коммутаторам UsersSW2, UsersSW3, SrvSW1, SrvSW2 и обоим коммутаторам ядра с подстановкой соответствующих VLAN. Так, UsersSW2 обслуживает торговый зал (VLAN 30) и склад (VLAN 40), UsersSW3 — службу безопасности (VLAN 60) и администрацию (VLAN 10), а пара SrvSW1/SrvSW2 — серверный сегмент (VLAN 80). Между двумя коммутаторами ядра настраивается транковый канал, по которому передаются все VLAN и служебный трафик HSRP. Корректность конфигурации проверяется командой `show vlan brief`, отображающей список VLAN и сопоставленные им порты, и командой `show interfaces trunk`, отображающей trunk-порты с разрешёнными VLAN."

  - type: heading
    level: 2
    text: Подсистема маршрутизации

  - type: paragraph
    text: "Подсистема маршрутизации реализует сетевой уровень проектируемой сети и обеспечивает обмен пакетами между шестью VLAN подразделений и серверной фермой, а также выход во внешние сети. Межсегментная маршрутизация выполняется централизованно на отказоустойчивом ядре: на каждом из двух многоуровневых коммутаторов CoreSW1 и CoreSW2 для каждой VLAN создаётся виртуальный интерфейс SVI (`interface Vlan <id>`), которому присваивается IP-адрес. Маршрутизация между VLAN включается командой `ip routing`. Поскольку интерфейсы SVI принадлежат разным IP-подсетям, коммутатор ядра выполняет inter-VLAN-маршрутизацию пакетов между сегментами без отдельного маршрутизатора [9]."

  - type: paragraph
    text: "Для резервирования шлюза по умолчанию применяется протокол HSRP (Hot Standby Router Protocol). На интерфейсах SVI обоих коммутаторов ядра в каждой VLAN настраивается общая HSRP-группа с виртуальным IP-адресом, который и выступает шлюзом по умолчанию для рабочих мест данной VLAN (например, 192.168.28.1 для VLAN 10). Один коммутатор назначается активным (более высокий приоритет, обрабатывает трафик), второй — резервным (standby); при отказе активного коммутатора резервный автоматически принимает виртуальный IP и MAC-адрес шлюза, и конечные устройства продолжают работу без переконфигурирования. Для централизованной раздачи адресов на каждом SVI настраивается `ip helper-address 192.168.28.116`, перенаправляющий широковещательные DHCP-запросы на сервер DHCP. Для обмена маршрутом по умолчанию с периметром между ядром и межсетевыми экранами применяется протокол динамической маршрутизации OSPF (описан ниже), а на пользовательских интерфейсах SVI он переводится в пассивный режим [9]. Пример настройки SVI, HSRP и маршрута по умолчанию на CoreSW1 приведён в листинге {ref:lst_routing}."

  - type: code
    caption: Настройка SVI, HSRP и маршрута по умолчанию на CoreSW1
    id: lst_routing
    code: |
      Switch>enable
      Switch#configure terminal
      Switch(config)#hostname CoreSW1
      CoreSW1(config)#ip routing
      CoreSW1(config)#interface Vlan10
      CoreSW1(config-if)#ip address 192.168.28.2 255.255.255.240
      CoreSW1(config-if)#ip helper-address 192.168.28.116
      CoreSW1(config-if)#standby 10 ip 192.168.28.1
      CoreSW1(config-if)#standby 10 priority 110
      CoreSW1(config-if)#standby 10 preempt
      CoreSW1(config-if)#exit
      CoreSW1(config)#interface Vlan20
      CoreSW1(config-if)#ip address 192.168.28.18 255.255.255.240
      CoreSW1(config-if)#ip helper-address 192.168.28.116
      CoreSW1(config-if)#standby 20 ip 192.168.28.17
      CoreSW1(config-if)#standby 20 priority 110
      CoreSW1(config-if)#standby 20 preempt
      CoreSW1(config-if)#exit
      CoreSW1(config)#interface Vlan80
      CoreSW1(config-if)#ip address 192.168.28.114 255.255.255.240
      CoreSW1(config-if)#standby 80 ip 192.168.28.113
      CoreSW1(config-if)#exit
      CoreSW1(config)#interface Vlan999
      CoreSW1(config-if)#ip address 192.168.28.241 255.255.255.248
      CoreSW1(config-if)#exit
      CoreSW1(config)#router ospf 1
      CoreSW1(config-router)#router-id 192.168.28.241
      CoreSW1(config-router)#passive-interface default
      CoreSW1(config-router)#no passive-interface Vlan999
      CoreSW1(config-router)#network 192.168.28.0 0.0.0.255 area 0
      CoreSW1(config-router)#end
      CoreSW1#write memory

  - type: paragraph
    text: "На втором коммутаторе ядра CoreSW2 настраиваются те же интерфейсы SVI с собственными физическими IP-адресами в каждой подсети и теми же виртуальными HSRP-адресами, но с более низким приоритетом (по умолчанию 100), что делает его резервным шлюзом. Транзит к межсетевым экранам реализован подсетью 192.168.28.240/29; интерфейсы SVI транзитного VLAN на CoreSW1 (.241) и CoreSW2 (.242) образуют соседство OSPF с межсетевыми экранами. Корректность маршрутизации проверяется командами `show ip route` (таблица маршрутов), `show ip interface brief` (состояние SVI) и `show standby brief` (роли активного и резервного шлюза HSRP по каждой VLAN). Связность между подсетями проверяется командой `ping` с конечного устройства."

  - type: paragraph
    text: "Помимо межсегментной маршрутизации на интерфейсах SVI, на границе ядра и периметра применяется динамическая маршрутизация по протоколу OSPF (Open Shortest Path First). Единый процесс OSPF (process 1, area 0) поднимается между обоими коммутаторами ядра CoreSW1/CoreSW2 и отказоустойчивой парой межсетевых экранов FW1/FW2 (Cisco ASA): соседство OSPF устанавливается через транзитную подсеть «ядро–межсетевой экран» 192.168.28.240/29. Ядро анонсирует в OSPF свои внутренние сети (пользовательские и серверный сегменты), однако на интерфейсах SVI пользовательских VLAN OSPF переводится в пассивный режим командой `passive-interface default` с последующим `no passive-interface Vlan999` — установление соседства и рассылка hello-пакетов разрешены только на транзитном интерфейсе ядро↔межсетевой экран (Vlan999), что исключает появление OSPF-трафика в пользовательских сегментах и снижает площадь поверхности атаки [9]."

  - type: paragraph
    text: "Маршрут по умолчанию ядро получает не статически, а динамически: межсетевой экран ASA отдаёт в область OSPF маршрут по умолчанию командой `default-information originate`, после чего оба коммутатора ядра автоматически устанавливают в таблицу маршрутизации запись `O*E2 0.0.0.0/0`, указывающую на активный межсетевой экран. Такая схема обеспечивает автоматический пересчёт маршрута при изменении топологии: при отказе основного канала или активного межсетевого экрана резервный межсетевой экран продолжает анонсировать маршрут по умолчанию, и ядро без вмешательства администратора перенаправляет исходящий трафик через работоспособный путь. Тем самым динамическая маршрутизация дополняет резервирование шлюзов HSRP на уровне ядра и failover межсетевых экранов на периметре, устраняя статический маршрут по умолчанию как единую точку ручной перенастройки. Корректность работы протокола проверяется командами `show ip ospf neighbor` (соседства в состоянии FULL) и `show ip route ospf` (наличие динамического маршрута `O*E2 0.0.0.0/0`); результаты проверки приведены на рисунке {ref:fig_ospf}."

  - type: heading
    level: 2
    text: Подсистема серверов

  - type: paragraph
    text: "Серверная ферма магазина состоит из четырёх серверов: WEB-сервер (HTTP), отдельный сервер DNS, сервер DHCP и сервер FTP. Все серверы размещены в VLAN 80 (192.168.28.112/28) и подключены access-портами к паре коммутаторов SrvSW1/SrvSW2, что резервирует их подключение на канальном уровне. WEB-серверу присвоен IP-адрес 192.168.28.114, серверу DNS — 192.168.28.115, серверу DHCP — 192.168.28.116, FTP-серверу — 192.168.28.117. Шлюзом по умолчанию для всех серверов служит виртуальный адрес HSRP интерфейсов SVI VLAN 80 на ядре — 192.168.28.113. Выделение серверного сегмента в отдельный VLAN не противоречит требованиям ГОСТ Р ИСО/МЭК 27001-2021 [12] при условии корректной настройки ACL на границе с пользовательскими VLAN."

  - type: paragraph
    text: "WEB-сервер настраивается через вкладку «Config» симулятора Cisco Packet Tracer в меню «HTTP» (рисунок {ref:fig_cpt_http}): включается служба HTTP, редактируется содержимое файла `index.html` — стартовая страница внутреннего портала магазина со ссылками на регламенты, прайс-листы, выгрузки товароучётной системы и контакты служб. На отдельном DNS-сервере (192.168.28.115) включается служба DNS (рисунок {ref:fig_cpt_dns}): создаётся ресурсная запись типа A, связывающая доменное имя `webserver.5ka.local` с IP-адресом WEB-сервера 192.168.28.114, и запись типа CNAME, связывающая псевдоним `intranet.5ka.local` с записью типа A. Это позволяет сотрудникам обращаться к внутреннему порталу по доменному имени, а не по IP-адресу [1]."

  - type: image
    image:
      path: images/cpt_server_http.png
      width_in: 5.8
  - type: figure_caption
    text: Настройка службы HTTP на WEB-сервере
    id: fig_cpt_http

  - type: image
    image:
      path: images/cpt_server_dns.png
      width_in: 5.8
  - type: figure_caption
    text: Настройка ресурсных записей DNS на WEB-сервере
    id: fig_cpt_dns

  - type: paragraph
    text: "Сервер DHCP настраивается через вкладку «Config» — «DHCP» (рисунок {ref:fig_cpt_dhcp}): задаётся имя пула (`vlan20-cash`, `vlan30-sales`, `vlan40-stock` и т. д. — для каждой VLAN подразделений), основной шлюз (виртуальный адрес HSRP соответствующей VLAN, например 192.168.28.17 для VLAN 20), DNS-сервер (192.168.28.115), начальный IP-адрес пула, маска подсети (255.255.255.240) и максимальное количество пользователей. Для каждой пользовательской VLAN создаётся отдельный пул адресов с собственным основным шлюзом — итого пять пулов."

  - type: paragraph
    text: "Поскольку DHCP-сервер находится в серверной VLAN 80, а пользовательские рабочие места — в других VLAN, широковещательные DHCP-запросы не пересекают границу подсети напрямую. Для их доставки на каждом интерфейсе SVI коммутаторов ядра настроена команда `ip helper-address 192.168.28.116`: коммутатор ядра принимает широковещательный DHCPDISCOVER, преобразует его в одноадресный запрос и пересылает на сервер DHCP, который выдаёт адрес из пула нужной VLAN. Так как `ip helper-address` настроен на интерфейсах SVI обоих коммутаторов ядра, выдача адресов сохраняется при отказе одного из них за счёт резервирования шлюза HSRP. Такая централизованная модель раздачи адресов является типовым решением и упрощает аудит выданных адресов [9, 12]."

  - type: image
    image:
      path: images/cpt_server_dhcp.png
      width_in: 5.8
  - type: figure_caption
    text: Настройка пулов DHCP-сервера для шести VLAN магазина
    id: fig_cpt_dhcp

  - type: paragraph
    text: "FTP-сервер настраивается через вкладку «Config» — «FTP» (рисунок {ref:fig_cpt_ftp}): создаются учётные записи пользователей с правами на чтение, запись, удаление, переименование. В проектируемой сети созданы учётные записи `manager.admin` (директор и товароведы, полный доступ к каталогам `/reports` и `/backup`), `sales.user` (торговый зал, чтение `/pricelists` и запись в `/inventory`), `stock.upload` (склад и приёмка, запись актов приёмки в `/receiving`), `cashier.ro` (кассовая зона, только чтение `/pricelists`), `it.backup` (ИТ-отдел, полный административный доступ); права назначены индивидуально. Проверка работы FTP выполняется с клиентского ПК командой `ftp 192.168.28.117` с последующей аутентификацией и выполнением команд `dir`, `get`, `put`."

  - type: image
    image:
      path: images/cpt_server_ftp.png
      width_in: 5.8
  - type: figure_caption
    text: Учётные записи и права доступа FTP-сервера
    id: fig_cpt_ftp

  - type: heading
    level: 2
    text: Подсистема разграничения доступа

  - type: paragraph
    text: "Подсистема разграничения доступа реализована на двух рубежах: межсегментными списками контроля доступа (ACL) на интерфейсах SVI коммутаторов ядра (фильтрация трафика между внутренними VLAN) и межсетевыми ACL на отказоустойчивой паре межсетевых экранов FW1/FW2 (фильтрация трафика между внутренней сетью и внешними сетями). ACL — упорядоченный набор правил, определяющих условия пропуска или отбрасывания пакетов на интерфейсе сетевого устройства. Устройство последовательно применяет критерии из списка в порядке их ввода; пакет, не соответствующий ни одному критерию, отвергается (правило неявного `deny any` в конце списка). Для каждого направления на интерфейс может быть назначен только один ACL [9]."

  - type: paragraph
    text: "В Cisco IOS различают стандартные (standard) и расширенные (extended) ACL. Стандартные ACL фильтруют пакеты только по адресу источника и имеют номера 1–99 и 1300–1999. Расширенные ACL фильтруют пакеты по адресу источника, адресу получателя, типу протокола (IP, TCP, UDP, ICMP), номерам портов отправителя и получателя; имеют номера 100–199 и 2000–2699. Для сети магазина применены преимущественно расширенные ACL, поскольку требуется фильтрация по адресам и портам одновременно."

  - type: paragraph
    text: "Политика разграничения доступа в проектируемой сети реализует принцип минимальных привилегий [12]. Сформулированы следующие правила: доступ к административным интерфейсам коммутаторов и межсетевых экранов разрешён только из VLAN 80 (ИТ-отдел) по протоколу SSH (TCP/22); доступ к серверу WEB (192.168.28.114) разрешён всем сотрудникам магазина по протоколам HTTP/HTTPS (TCP/80, TCP/443); обращение к серверу DNS (192.168.28.115) по UDP/53 разрешено всем пользовательским VLAN; доступ к серверу FTP (192.168.28.117) разрешён только из VLAN 30 (Торговый зал), VLAN 40 (Склад) и VLAN 10 (Администрация) по протоколу FTP (TCP/21); кассовая зона (VLAN 20) выделена в изолированный фискальный контур — из неё разрешены только обращение к WEB-серверу по HTTP/HTTPS и исходящий трафик к оператору фискальных данных и банку-эквайеру через межсетевой экран, а прямой доступ к прочим внутренним VLAN и серверам (кроме WEB) запрещён; прямой межсегментный доступ к серверной подсети из пользовательских VLAN, кроме разрешённых служб, запрещён. Межсегментные ACL применяются на интерфейсах SVI ядра во входящем направлении. Пример настройки межсегментного ACL фискального контура на коммутаторе ядра CoreSW1 приведён в листинге {ref:lst_acl}."

  - type: code
    caption: Настройка межсегментного ACL на ядре CoreSW1 (изоляция фискального контура VLAN 20)
    id: lst_acl
    code: |
      CoreSW1(config)#ip access-list extended CASH-IN
      CoreSW1(config-ext-nacl)#remark === ACL for Cash zone (VLAN 20) ===
      CoreSW1(config-ext-nacl)#permit tcp 192.168.28.16 0.0.0.15 host 192.168.28.114 eq 80
      CoreSW1(config-ext-nacl)#permit tcp 192.168.28.16 0.0.0.15 host 192.168.28.114 eq 443
      CoreSW1(config-ext-nacl)#permit udp 192.168.28.16 0.0.0.15 host 192.168.28.115 eq 53
      CoreSW1(config-ext-nacl)#deny ip 192.168.28.16 0.0.0.15 192.168.28.0 0.0.0.255
      CoreSW1(config-ext-nacl)#permit ip 192.168.28.16 0.0.0.15 any
      CoreSW1(config-ext-nacl)#exit
      CoreSW1(config)#interface Vlan20
      CoreSW1(config-if)#ip access-group CASH-IN in
      CoreSW1(config-if)#end
      CoreSW1#write memory

  - type: paragraph
    text: "Идентичный ACL настраивается на втором коммутаторе ядра CoreSW2, поскольку при переключении HSRP активным шлюзом VLAN 20 может стать любой из них; одинаковая политика на обоих коммутаторах гарантирует неизменность правил разграничения при отказе. Аналогичные межсегментные ACL созданы для остальных VLAN с учётом политик доступа. Правило `deny ip 192.168.28.16 0.0.0.15 any` на интерфейсе межсетевого экрана, обращённом во внешние сети, дополнительно ограничивает выход кассовой зоны только адресами ОФД и банка-эквайера. Корректность работы ACL проверяется командой `show access-lists`, отображающей текущий список правил с количеством совпадений, и командой `show ip interface Vlan20`, отображающей привязку ACL к интерфейсу. Функциональная проверка — попытка `ping` с кассового ПК (VLAN 20) на сервер DHCP (192.168.28.116) должна завершаться сообщением «Destination host unreachable», а обращение по `http://192.168.28.114` или `http://intranet.5ka.local` — успешным."

  - type: heading
    level: 2
    text: Подсистема трансляции сетевых адресов

  - type: paragraph
    text: "Подсистема NAT обеспечивает связь сети магазина с глобальной сетью Интернет через отказоустойчивую пару межсетевых экранов FW1/FW2 (Cisco ASA). Локальная сеть магазина построена на частных IP-адресах диапазона 192.168.0.0/16 в соответствии с RFC 1918 [10]. Эти адреса не маршрутизируются в Интернете — провайдеры обязаны отбрасывать пакеты с такими адресами отправителей или получателей в публичных каналах. Для преобразования частных адресов в публичные применяется технология NAT [2]."

  - type: paragraph
    text: "В проектируемой сети применён режим Overloading (PAT, Port Address Translation) — преобразование нескольких внутренних адресов в один внешний за счёт использования портов транспортного уровня. Каждое исходящее соединение получает уникальный номер порта на внешнем интерфейсе межсетевого экрана, что позволяет однозначно сопоставить ответный пакет с конкретным внутренним хостом [9]. PAT экономит публичные IP-адреса (для всего магазина достаточно одного публичного адреса на провайдера) и обеспечивает скрытие внутренней топологии сети, что соответствует требованию защиты адресной информации внутренней сети [7, 12]. Поскольку межсетевые экраны работают в режиме Active/Standby (failover), таблица трансляций синхронизируется между FW1 и FW2: при отказе активного экрана резервный продолжает обслуживать установленные сессии без их разрыва."

  - type: paragraph
    text: "Внешними интерфейсами для NAT служат два канала: основной — к провайдеру ISP1 (Ростелеком, интерфейс outside1), резервный — к ISP2 (МТС, интерфейс outside2); оба заводятся на межсетевые экраны через пограничный коммутатор OutsideSW. Внутренним интерфейсом (inside) служит транзитная подсеть к ядру 192.168.28.240/29, через которую поступает весь пользовательский трафик. Подлежащие трансляции внутренние подсети заданы объектной группой, охватывающей пользовательские и серверный сегменты. По умолчанию трафик направляется в ISP1; при недоступности основного канала (SLA-мониторинг достижимости шлюза провайдера) маршрут по умолчанию переключается на резервный канал ISP2. Пример настройки PAT и резервирования каналов на межсетевом экране Cisco ASA приведён в листинге {ref:lst_nat}."

  - type: code
    caption: Настройка PAT и двух провайдеров на межсетевом экране Cisco ASA
    id: lst_nat
    code: |
      FW1(config)# object network INSIDE-NET
      FW1(config-network-object)#  subnet 192.168.28.0 255.255.255.0
      FW1(config-network-object)#  nat (inside,outside1) dynamic interface
      FW1(config-network-object)# exit
      FW1(config)# object network INSIDE-NET-BACKUP
      FW1(config-network-object)#  subnet 192.168.28.0 255.255.255.0
      FW1(config-network-object)#  nat (inside,outside2) dynamic interface
      FW1(config-network-object)# exit
      FW1(config)# route inside 192.168.28.0 255.255.255.0 192.168.28.241 1
      FW1(config)# sla monitor 1
      FW1(config-sla-monitor)#  type echo protocol ipIcmpEcho <ISP1-gw> interface outside1
      FW1(config)# track 1 rtr 1 reachability
      FW1(config)# route outside1 0.0.0.0 0.0.0.0 <ISP1-gw> 1 track 1
      FW1(config)# route outside2 0.0.0.0 0.0.0.0 <ISP2-gw> 254
      FW1(config)# failover
      FW1(config)# failover lan unit primary

  - type: paragraph
    text: "Резервный межсетевой экран FW2 настраивается как failover lan unit secondary и автоматически синхронизирует конфигурацию и таблицы трансляций с активным устройством. Маршрут по умолчанию на основной канал ISP1 имеет административное расстояние 1 и привязан к объекту мониторинга track 1; при потере связи с шлюзом ISP1 этот маршрут изымается из таблицы и в силу вступает резервный маршрут на ISP2 (административное расстояние 254). Контроль трансляций выполняется командой `show xlate`, отображающей текущую таблицу преобразований, команда `show failover` показывает роли активного и резервного экранов и состояние синхронизации, а `show route` — какой канал (ISP1 или ISP2) используется в данный момент как маршрут по умолчанию."

  # ─────────────────────────────────────────────────────────────────────────
  # ГЛАВА 4. ЗАЩИЩЁННОСТЬ СЕТИ КЛУБА
  # ─────────────────────────────────────────────────────────────────────────
  - type: heading
    level: 1
    text: Защищённость сети магазина
    id: ch_security

  - type: heading
    level: 2
    text: Модель угроз информационной безопасности

  - type: paragraph
    text: "Тема курсовой работы — разработка сети малого предприятия в защищённом исполнении — предполагает явное обоснование принятых архитектурных решений на уровне модели угроз. Под моделью угроз понимается формализованное описание совокупности потенциальных угроз информационной безопасности, актуальных для конкретной информационной системы и её информационных активов. Для магазина розничной торговли как оператора персональных данных модель угроз формируется в соответствии с методическими рекомендациями ФСТЭК России, приказом ФСТЭК России № 21 [8] и требованиями Федерального закона № 152-ФЗ [7]."

  - type: paragraph
    text: "Перечень актуальных угроз информационной безопасности для компьютерной сети магазина «Альфа-Маркет» сформирован на основе анализа состава защищаемой информации (персональные данные покупателей — участников программы лояльности и сотрудников; фискальные данные контрольно-кассовой техники; сведения о выручке, поставках и ценах; записи систем видеонаблюдения торгового зала и кассовой зоны), типового состава нарушителей (внешний неавторизованный нарушитель, внутренний нарушитель из числа сотрудников, недобросовестный покупатель, организованная преступная группа) и типового перечня сетевых угроз предприятий розничной торговли [7, 8]. Угрозы и меры противодействия, реализованные на уровне сетевой инфраструктуры, приведены в таблице {ref:tbl_threats}."

  - type: table
    caption: Угрозы информационной безопасности и меры противодействия на сетевом уровне
    id: tbl_threats
    data:
    - ["№", "Угроза", "Источник", "Мера противодействия"]
    - ["1", "Несанкционированный доступ к подсетям подразделений с пользовательских ПК", "Внешний / внутренний нарушитель", "Сегментация на VLAN, межсегментные ACL на SVI ядра"]
    - ["2", "Прослушивание широковещательного трафика на канальном уровне", "Внутренний нарушитель", "Изоляция широковещательных доменов средствами VLAN"]
    - ["3", "Несанкционированный доступ к серверной подсети", "Внешний / внутренний нарушитель", "Выделенный VLAN серверов, ACL deny на интерфейсах SVI ядра"]
    - ["4", "Несанкционированный доступ к административным интерфейсам сетевого оборудования", "Внутренний нарушитель", "ACL разрешения управления (SSH) только из VLAN 80"]
    - ["5", "Утечка адресной информации внутренней сети во внешние каналы", "Внешний нарушитель", "PAT на межсетевых экранах ASA"]
    - ["6", "Подмена адреса источника (IP spoofing)", "Внешний нарушитель", "Ingress filtering по RFC 2827 на межсетевых экранах в сторону провайдеров [15]"]
    - ["7", "Атаки типа «отказ в обслуживании» (DoS) на серверы магазина", "Внешний нарушитель", "Фильтрация входящего трафика по протоколам и портам на межсетевых экранах"]
    - ["8", "Несанкционированная модификация конфигурации сетевого оборудования", "Внутренний нарушитель", "Парольная защита привилегированного режима, шифрование паролей в конфигурации"]
    - ["9", "Компрометация фискального контура кассовой зоны и доступ к данным ККТ", "Внутренний / внешний нарушитель", "Изоляция VLAN 20 средствами ACL, Port Security на портах касс, разрешён только HTTP/HTTPS к WEB и трафик к ОФД"]
    - ["10", "Перехват сессии управления оборудованием", "Внутренний / внешний нарушитель", "Запрет Telnet, использование SSH для удалённого управления"]
    - ["11", "Отказ оборудования или канала связи (нарушение доступности)", "Сбой оборудования / провайдера", "Дублирование ядра и HSRP, failover межсетевых экранов, два провайдера"]

  - type: heading
    level: 2
    text: Сегментация трафика и VLAN-изоляция

  - type: paragraph
    text: "Сегментация трафика — основа защищённой архитектуры сети магазина. В соответствии с требованиями Федерального закона № 152-ФЗ [7] и Приказа ФСТЭК России № 21 [8] информационные системы персональных данных должны быть логически изолированы от других сегментов сети, а взаимодействие между сегментами должно осуществляться через сетевые экраны или средства разграничения сетевого доступа. Аналогичные требования к коммуникациям закреплены в стандарте ГОСТ Р ИСО/МЭК 27001-2021 [12]."

  - type: paragraph
    text: "В проектируемой сети магазина сегментация реализована на двух уровнях. На канальном уровне (L2) сегментация реализована средствами VLAN — каждое функциональное подразделение магазина помещено в отдельный VLAN, что обеспечивает изоляцию широковещательных доменов и невидимость хостов соседних подразделений по протоколам канального уровня (ARP, MAC-обмен). На сетевом уровне (L3) сегментация реализована на интерфейсах SVI коммутаторов ядра с обязательным прохождением межсегментного трафика через расширенные ACL, что позволяет применять политики разграничения доступа на уровне IP-адресов и портов; трафик во внешние сети дополнительно фильтруется межсетевыми экранами ASA на периметре."

  - type: paragraph
    text: "Особое внимание уделено изоляции фискального контура кассовой зоны (VLAN 20): кассовые рабочие места и контрольно-кассовая техника получают доступ только к WEB-серверу по HTTP/HTTPS и к внешним сервисам оператора фискальных данных и банка-эквайера через межсетевой экран и PAT, без возможности обращаться к другим внутренним сегментам магазина. Доступ к административным интерфейсам коммутаторов ядра и межсетевых экранов разрешён только из VLAN 80 (ИТ-отдел) по протоколу SSH. Серверная ферма размещена в выделенном VLAN 80 (192.168.28.112/28); прямой доступ к серверам из пользовательских VLAN ограничен правилом «HTTP/HTTPS к WEB-серверу и DNS-запросы — для всех; FTP к серверу выгрузок товароучётной системы — только для торгового зала, склада и администрации; всё остальное запрещено»."

  - type: heading
    level: 2
    text: Защита от несанкционированного доступа и парольная политика

  - type: paragraph
    text: "Защита от несанкционированного доступа к сетевому оборудованию реализуется набором базовых мер Cisco IOS, обязательных для применения в информационных системах персональных данных [7, 8]. К таким мерам относятся: установка паролей на привилегированный режим (`enable secret`), парольная защита консольного и виртуальных терминальных линий (line con 0, line vty 0 4), включение шифрования паролей в конфигурации (`service password-encryption`), запрет протокола Telnet и переход на SSH для удалённого управления, привязка MAC-адресов конечных устройств к access-портам коммутаторов (Port Security), отключение неиспользуемых портов и помещение их в неиспользуемый VLAN (black-hole VLAN). Базовый набор команд парольной защиты приведён в листинге {ref:lst_security}."

  - type: code
    caption: Базовая парольная защита коммутатора ядра CoreSW1
    id: lst_security
    code: |
      CoreSW1(config)#enable secret cisco-ENABLE-2026
      CoreSW1(config)#service password-encryption
      CoreSW1(config)#username admin privilege 15 secret cisco-ADMIN-2026
      CoreSW1(config)#ip domain-name 5ka.local
      CoreSW1(config)#crypto key generate rsa modulus 1024
      CoreSW1(config)#ip ssh version 2
      CoreSW1(config)#line console 0
      CoreSW1(config-line)#password cisco-CON-2026
      CoreSW1(config-line)#login
      CoreSW1(config-line)#exec-timeout 5 0
      CoreSW1(config-line)#exit
      CoreSW1(config)#line vty 0 4
      CoreSW1(config-line)#login local
      CoreSW1(config-line)#transport input ssh
      CoreSW1(config-line)#exec-timeout 5 0
      CoreSW1(config-line)#exit
      CoreSW1(config)#banner motd # Authorized access only #
      CoreSW1(config)#end
      CoreSW1#write memory

  - type: paragraph
    text: "Парольная политика магазина устанавливает минимальные требования к паролям административных учётных записей: длина не менее 12 символов, наличие букв верхнего и нижнего регистра, цифр и спецсимволов, обязательная смена раз в 90 дней, запрет повторного использования последних 12 паролей. Политика реализуется организационно — приказом директора магазина о парольной защите — и контролируется при техническом аудите [12]. На коммутаторах доступа дополнительно настраивается Port Security: каждый access-порт ограничен одним MAC-адресом, при попытке подключения устройства с другим MAC-адресом порт блокируется до вмешательства администратора (action shutdown). Эта мера особенно важна в кассовой зоне и торговом зале, где сетевые розетки потенциально доступны посторонним посетителям."

  - type: heading
    level: 2
    text: Защита персональных данных покупателей и фискальной информации

  - type: paragraph
    text: "Магазин «Альфа-Маркет» обрабатывает персональные данные покупателей — участников программы лояльности (фамилии, имена, отчества, номера телефонов, история покупок, состояние бонусного счёта) и персональные данные сотрудников, а также фискальные данные контрольно-кассовой техники. Эти сведения относятся к иным категориям персональных данных по классификации Приказа ФСТЭК России № 21 [8] (специальные категории и биометрические данные не обрабатываются). С учётом количества субъектов ПДн (покупателей программы лояльности — более 100 000) и состава угроз для информационной системы магазина установлен 3-й уровень защищённости персональных данных (УЗ-3), что определяет состав обязательных мер защиты [8]."

  - type: paragraph
    text: "На уровне сетевой инфраструктуры реализованы следующие меры защиты персональных данных: сегментация трафика средствами VLAN (мера ИАФ.1, разграничение доступа), фильтрация трафика средствами ACL на ядре и межсетевых экранах (мера УПД.4, контроль информационных потоков), сокрытие адресной информации внутренней сети средствами PAT (мера ОПС.3, защита границ системы), парольная защита и шифрование паролей в конфигурации сетевого оборудования (меры ИАФ.2, ИАФ.5), регистрация событий безопасности на коммутаторах ядра и межсетевых экранах (мера РСБ.1), обеспечение доступности за счёт резервирования ядра, межсетевых экранов и каналов связи (мера ОДТ.5) [8]. Совместно перечисленные меры формируют базовый набор требований к сетевой подсистеме информационной системы магазина."

  - type: paragraph
    text: "Особое внимание уделяется защите фискального контура и данных программы лояльности: компрометация кассовой зоны влечёт нарушение требований Федерального закона № 54-ФЗ к сохранности фискальных данных [16], а утечка базы участников программы лояльности — нарушение 152-ФЗ. Кассовая зона выделена в отдельный VLAN 20 с жёстким ACL, разрешающим лишь HTTP/HTTPS к WEB-серверу и исходящий трафик к оператору фискальных данных. Межсегментные ACL запрещают прямой доступ к FTP-серверу из любых VLAN, кроме торгового зала, склада и администрации. Исходящий трафик в сторону Интернета проходит через межсетевой экран и PAT и подлежит регистрации; резервирование канала вторым провайдером гарантирует непрерывность передачи фискальных данных при отказе основного канала. В реальной инфраструктуре действующего магазина дополнительно применяется межсетевой экран следующего поколения с инспекцией прикладного уровня и системой предотвращения утечек данных (DLP), что выходит за рамки настоящей курсовой работы."

  - type: heading
    level: 2
    text: Соответствие требованиям регулятора

  - type: paragraph
    text: "Спроектированная сеть магазина соответствует базовому составу мер защиты информации, установленных для малых предприятий, обрабатывающих персональные данные. Ключевые соответствия приведены в таблице {ref:tbl_compliance}."

  - type: table
    caption: Соответствие проектных решений требованиям регулятора
    id: tbl_compliance
    data:
    - ["Документ / норма", "Требование", "Реализация в проекте"]
    - ["152-ФЗ ст. 19 [7]", "Принятие правовых, организационных и технических мер защиты ПДн", "ACL на ядре и МЭ, VLAN-изоляция, парольная защита"]
    - ["54-ФЗ ст. 5 [16]", "Обеспечение сохранности и целостности фискальных данных ККТ", "Изоляция фискального контура VLAN 20, ACL, резервный канал к ОФД"]
    - ["2300-1 / ГОСТ Р 51303 [5, 6]", "Защита сведений о покупателях и расчётах", "Разграничение доступа к данным программы лояльности, изоляция СБ в VLAN 60"]
    - ["ГОСТ Р ИСО/МЭК 27001-2021 A.13 [12]", "Безопасность коммуникаций и сегментация сетей", "Выделение серверного VLAN, межсегментные ACL на SVI ядра"]
    - ["Приказ ФСТЭК № 21, мера УПД.4 [8]", "Контроль информационных потоков", "Расширенные ACL на ядре и межсетевых экранах"]
    - ["Приказ ФСТЭК № 21, мера ОПС.3 [8]", "Защита периметра системы", "Пара межсетевых экранов ASA (failover), PAT, ingress filtering"]
    - ["Приказ ФСТЭК № 21, мера ОДТ.5 [8]", "Обеспечение доступности информации (отказоустойчивость)", "Резерв ядра (HSRP), failover МЭ, два провайдера"]
    - ["ГОСТ Р ИСО/МЭК 27001-2021 A.9 [12]", "Управление доступом к сетевым сервисам", "Шифрование SSH, отказ от Telnet"]

  # ─────────────────────────────────────────────────────────────────────────
  # ГЛАВА 5. ТЕСТИРОВАНИЕ И ОЦЕНКА РЕЗУЛЬТАТОВ
  # ─────────────────────────────────────────────────────────────────────────
  - type: heading
    level: 1
    text: Тестирование и оценка результатов
    id: ch_testing

  - type: paragraph
    text: "Тестирование спроектированной сети выполняется в среде Cisco Packet Tracer и направлено на проверку выполнения функциональных и нефункциональных требований к сети, сформулированных в подразделе 1.4. Программа тестирования включает: проверку связности между всеми VLAN магазина через ядро, проверку отказоустойчивости (переключение шлюзов HSRP и пары межсетевых экранов в режиме failover), проверку корректности работы серверов, проверку срабатывания списков контроля доступа фискального контура, проверку работы трансляции сетевых адресов к двум провайдерам. Все проверки выполняются последовательно от простых к сложным."

  - type: heading
    level: 2
    text: Проверка связности

  - type: paragraph
    text: "Базовая проверка связности выполняется командой `ping` с произвольно выбранного рабочего места во всех остальных VLAN, разрешённых политикой ACL. Положительным результатом считается успешное прохождение четырёх ICMP-эхо-запросов и четырёх ответов с временем отклика менее 10 мс (типичное значение для коммутируемой среды Cisco Packet Tracer). Сводка результатов проверки связности приведена в таблице {ref:tbl_ping}."

  - type: table
    caption: Результаты проверки связности (ping)
    id: tbl_ping
    data:
    - ["Источник", "Назначение", "Результат", "Среднее время отклика"]
    - ["Director (VLAN 10)", "WEB-сервер 192.168.28.114", "Успешно, 4/4", "5 мс"]
    - ["Director (VLAN 10)", "Cashier-1 (VLAN 20)", "Успешно, 4/4", "8 мс"]
    - ["Sales-1 (VLAN 30)", "Store-1 (VLAN 40)", "Успешно, 4/4", "5 мс"]
    - ["Store-1 (VLAN 40)", "FTP-сервер 192.168.28.117", "Успешно, 4/4", "7 мс"]
    - ["Security-1 (VLAN 60)", "Director (VLAN 10)", "Успешно, 4/4", "9 мс"]
    - ["IT-1 (VLAN 80)", "DHCP-сервер 192.168.28.116", "Успешно, 4/4", "4 мс"]
    - ["Cashier-1 (VLAN 20)", "WEB-сервер 192.168.28.114", "Успешно, 4/4", "7 мс"]
    - ["Cashier-1 (VLAN 20)", "Director (VLAN 10)", "Заблокировано ACL", "—"]

  - type: paragraph
    text: "Все запланированные направления связности по протоколу ICMP отрабатывают корректно. Попытка обращения из кассовой зоны (VLAN 20) в прочие служебные сегменты магазина отвергается ACL, что подтверждает корректность изоляции фискального контура. Команда `tracert` (на ПК) или `traceroute` (на Cisco IOS) отображает ожидаемое количество промежуточных переходов: один хоп (виртуальный адрес HSRP — шлюз VLAN на ядре) для трафика между внутренними VLAN, так как вся межсегментная маршрутизация выполняется на ядре, и дополнительный хоп через межсетевой экран при выходе во внешние сети. Это подтверждает правильность построения таблиц маршрутизации и соответствие фактической топологии проектной."

  - type: paragraph
    text: "Отказоустойчивость проверяется отдельно. Для проверки резервирования шлюза выполняется непрерывный `ping` с рабочего места на внешний адрес, после чего активный коммутатор ядра отключается (`shutdown` восходящих интерфейсов или выключение устройства); команда `show standby brief` на CoreSW2 подтверждает переход роли Active к резервному коммутатору, а потеря составляет единичные ICMP-пакеты, после чего связность восстанавливается без переконфигурирования рабочих мест. Аналогично проверяется failover межсетевых экранов: при отключении активного экрана FW1 команда `show failover` на FW2 показывает переход в состояние Active с сохранением таблицы трансляций, установленные сессии не разрываются. Переключение провайдеров проверяется отключением канала ISP1: команда `show route` на межсетевом экране подтверждает вступление в силу резервного маршрута на ISP2, выход в Интернет сохраняется. Пример вывода ping и tracert на клиентском ПК Director приведён на рисунке {ref:fig_cpt_ping}."

  - type: image
    image:
      path: images/cpt_ping.png
      width_in: 5.5
  - type: figure_caption
    text: Проверка связности ping и tracert на ПК Director
    id: fig_cpt_ping

  - type: heading
    level: 2
    text: Проверка работы серверов

  - type: paragraph
    text: "Проверка работы WEB-сервера выполняется обращением из браузера на любом клиентском ПК по адресам `http://192.168.28.114` и `http://intranet.5ka.local` (по доменному имени, разрешаемому через отдельный DNS-сервер 192.168.28.115). При успешном обращении в браузере отображается стартовая страница внутреннего портала магазина (рисунок {ref:fig_cpt_browser}). Дополнительно проверяется обработка несуществующих доменных имён — обращение к `http://wrong-name.5ka.local` должно завершаться ошибкой DNS resolution failure."

  - type: image
    image:
      path: images/cpt_browser.png
      width_in: 5.5
  - type: figure_caption
    text: Открытие внутреннего портала магазина по доменному имени `intranet.5ka.local`
    id: fig_cpt_browser

  - type: paragraph
    text: "Проверка работы DHCP выполняется на клиентских ПК подразделений командами `ipconfig /release` и `ipconfig /renew`. После выполнения первой команды у ПК очищается текущая сетевая конфигурация, после второй — ПК отправляет широковещательный DHCPDISCOVER, который коммутатор ядра по команде `ip helper-address` пересылает на сервер DHCP (192.168.28.116), и в ответ ПК получает IP-адрес из соответствующего пула, маску, шлюз (виртуальный адрес HSRP) и адрес DNS-сервера (192.168.28.115). Положительный результат — IP-адрес из ожидаемого диапазона, корректные шлюз и DNS, что подтверждается на рисунке {ref:fig_cpt_dhcp_test}."

  - type: image
    image:
      path: images/cpt_dhcp_release.png
      width_in: 5.5
  - type: figure_caption
    text: Получение IP-адреса по DHCP на ПК Cashier-1 (release / renew)
    id: fig_cpt_dhcp_test

  - type: paragraph
    text: "Проверка работы FTP-сервера выполняется командой `ftp 192.168.28.117` с клиентских ПК торгового зала и склада (для них доступ разрешён) и кассовой зоны (для неё доступ запрещён ACL). Положительный результат для торгового зала — успешная авторизация, выполнение команд `dir`, `get pricelists/price-20260609.csv`, `put inventory/stock-20260609.csv`. Положительный результат для кассовой зоны — отказ соединения по тайм-ауту, что подтверждает срабатывание правила deny в межсегментном ACL на интерфейсе SVI VLAN 20 коммутатора ядра."

  - type: heading
    level: 2
    text: Проверка работы списков контроля доступа

  - type: paragraph
    text: "Корректность работы расширенных ACL проверяется по двум направлениям: положительная проверка (трафик, который должен проходить, проходит) и отрицательная проверка (трафик, который должен отбрасываться, отбрасывается). Команда `show access-lists` после серии тестов отображает счётчики совпадений по каждому правилу, что подтверждает фактическое прохождение пакетов через ACL и правильность срабатывания правил. Например, на коммутаторе ядра правило `permit tcp 192.168.28.16 0.0.0.15 host 192.168.28.114 eq 80` после нескольких обращений к WEB-серверу с кассового ПК накапливает соответствующее число совпадений, а правило `deny ip 192.168.28.16 0.0.0.15 192.168.28.0 0.0.0.255` накапливает совпадения при попытках обращения из кассовой зоны в прочие служебные сегменты магазина."

  - type: paragraph
    text: "Дополнительно проверяется, что обращение к административным интерфейсам коммутаторов ядра и межсетевых экранов по SSH из VLAN 20, 30, 40, 60 завершается тайм-аутом, а из VLAN 80 (ИТ-отдел) — успешно (с учётом того, что SSH-доступ требует корректного логина и пароля). Это подтверждает, что управление оборудованием изолировано от пользовательских VLAN подразделений в соответствии с политикой безопасности и требованиями регулятора [7, 8]."

  - type: heading
    level: 2
    text: Проверка работы трансляции сетевых адресов

  - type: paragraph
    text: "Корректность работы PAT проверяется после инициирования любого исходящего соединения с клиентского ПК (например, обращения к публичному ресурсу или ICMP-эхо-запроса в адрес внешнего тестового хоста, эмулирующего Интернет). После выполнения исходящего обращения команда `show xlate` на активном межсетевом экране отображает запись преобразования внутреннего адреса рабочего места Director (192.168.28.2) в публичный адрес внешнего интерфейса канала ISP1 с уникальным портом, а команда `show conn` — соответствующую установленную сессию. Это подтверждает, что трансляция адресов и портов работает в соответствии с конфигурацией. Сводный вывод команд `show standby brief` и `show ip route` на коммутаторе ядра CoreSW1 и `show failover`, `show xlate`, `show route` на межсетевом экране приведён на рисунке {ref:fig_cpt_cli}."

  - type: image
    image:
      path: images/cpt_router_cli.png
      width_in: 6.0
  - type: figure_caption
    text: Вывод команд проверки HSRP, маршрутизации, failover и трансляции адресов
    id: fig_cpt_cli

  - type: paragraph
    text: "Команда `show xlate count` и `show failover statistics` отображают агрегированные показатели: число активных трансляций, состояние и статистику синхронизации отказоустойчивой пары экранов. Положительный результат — число активных трансляций ненулевое, отказоустойчивая пара находится в согласованном состоянии (один Active, один Standby Ready), при имитации отказов связность восстанавливается автоматически. По результатам тестирования все подсистемы — VLAN, межсегментная маршрутизация на ядре с резервированием HSRP, серверы, ACL, NAT с двумя провайдерами и failover межсетевых экранов — функционируют в соответствии с проектом, что подтверждает корректность спроектированной отказоустойчивой архитектуры сети магазина."

  - type: heading
    level: 2
    text: Проверка динамической маршрутизации OSPF

  - type: paragraph
    text: "Корректность работы протокола динамической маршрутизации OSPF проверяется на коммутаторах ядра командами `show ip ospf neighbor` и `show ip route ospf`. Команда `show ip ospf neighbor` отображает список соседей OSPF: оба межсетевых экрана отказоустойчивой пары FW1/FW2 видны как соседи в состоянии FULL через транзитную подсеть «ядро–межсетевой экран» 192.168.28.240/29, что подтверждает успешное установление соседства и синхронизацию баз данных состояния каналов. Команда `show ip route ospf` отображает полученный по OSPF маршрут по умолчанию `O*E2 0.0.0.0/0`, который межсетевой экран анонсирует командой `default-information originate`. Наличие этой записи подтверждает, что ядро получает маршрут по умолчанию динамически, а не из статической конфигурации. Вывод команд проверки OSPF на коммутаторе ядра приведён на рисунке {ref:fig_ospf}."

  - type: image
    image:
      path: images/cpt_ospf.png
      width_in: 6.0
  - type: figure_caption
    text: Проверка работы протокола OSPF на ядре сети
    id: fig_ospf

  - type: paragraph
    text: "Дополнительно проверяется автоматический пересчёт маршрута при изменении топологии: при административном отключении транзитного интерфейса к активному межсетевому экрану OSPF снимает соответствующий маршрут и переключает маршрут по умолчанию на резервный путь без вмешательства администратора, что подтверждает заявленную отказоустойчивость на уровне маршрутизации."

  # ─────────────────────────────────────────────────────────────────────────
  # ЗАКЛЮЧЕНИЕ
  # ─────────────────────────────────────────────────────────────────────────
  - type: heading
    level: 0
    text: Заключение

  - type: paragraph
    text: "В рамках курсовой работы спроектирована и программно реализована иерархическая отказоустойчивая компьютерная сеть магазина «Альфа-Маркет» по адресу г. Энск, ул. Центральная, 1, в защищённом исполнении. Цель работы — разработка и реализация архитектуры сети малого предприятия розничной торговли с применением технологий VLAN, межсегментной маршрутизации на отказоустойчивом ядре, резервирования шлюзов HSRP, отказоустойчивости межсетевых экранов, резервирования внешнего канала двумя провайдерами, серверных служб, списков контроля доступа и трансляции сетевых адресов — достигнута полностью."

  - type: paragraph
    text: "В ходе работы выполнены следующие основные результаты. Проведено предпроектное обследование объекта информатизации: определён состав подразделений (шесть функциональных сегментов), численность рабочих мест (33 ПК, 33 сотрудника), состав серверной фермы (WEB, DNS, DHCP, FTP) и режим работы магазина. Разработаны общая, физическая и логические схемы сети уровней L1, L2, L3, отражающие архитектуру сети с разной степенью детализации. Составлен IP-план сети из шести пользовательских подсетей в адресном пространстве 192.168.28.0/24 и кабельный журнал структурированной кабельной системы."

  - type: paragraph
    text: "Программная реализация выполнена в симуляторе Cisco Packet Tracer и включает настройку шести VLAN на коммутаторах доступа и ядра, межсегментной маршрутизации на интерфейсах SVI двух коммутаторов ядра CoreSW1/CoreSW2 с резервированием шлюзов по протоколу HSRP, динамической маршрутизации OSPF между ядром и отказоустойчивой парой межсетевых экранов Cisco ASA (режим Active/Standby failover) с получением маршрута по умолчанию, серверов WEB, DNS, DHCP (с раздачей через `ip helper-address`) и FTP, межсегментных списков контроля доступа на ядре и межсетевых экранах, а также режима PAT с резервированием внешнего канала двумя провайдерами (ISP1 Ростелеком, ISP2 МТС)."

  - type: paragraph
    text: "Защищённость спроектированной сети проанализирована в соответствии с моделью угроз. Сегментация трафика на шесть VLAN, межсегментная фильтрация через ACL на ядре, периметровая защита парой межсетевых экранов, изоляция фискального контура кассовой зоны, режим PAT и резервирование ядра, межсетевых экранов и каналов связи обеспечивают соответствие проектных решений требованиям Федерального закона № 152-ФЗ «О персональных данных», Федерального закона № 54-ФЗ «О применении контрольно-кассовой техники», Приказа ФСТЭК России № 21 (включая меры контроля потоков и обеспечения доступности) и ГОСТ Р ИСО/МЭК 27001-2021 в части мер защиты на сетевом уровне."

  - type: paragraph
    text: "Тестирование сети в симуляторе Cisco Packet Tracer подтвердило корректность функционирования всех подсистем: связность между разрешёнными VLAN через ядро, автоматическое переключение шлюзов HSRP и пары межсетевых экранов в режиме failover, переключение между провайдерами, работу серверов WEB, DNS, DHCP, FTP, срабатывание правил ACL для разрешённого и запрещённого трафика, корректное преобразование адресов в режиме PAT. Программа тестирования выполнена в полном объёме, ошибок не выявлено."

  - type: paragraph
    text: "Практическая значимость работы — готовность проекта к развёртыванию на действующем предприятии розничной торговли с минимальной адаптацией под фактическое оборудование. При практическом внедрении в 2026 году рекомендуется заменить оборудование Cisco на сертифицированный ФСТЭК России аналог отечественного производителя (Eltex), а также дополнить сетевую инфраструктуру средствами защиты следующего поколения — межсетевым экраном с инспекцией прикладного уровня и системой DLP. Рассмотрение этих мер выходит за рамки настоящей курсовой работы и может стать темой отдельного дипломного исследования."

