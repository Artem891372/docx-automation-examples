document:
  type: section
  content:
  - type: heading
    level: 1
    text: Требования к курсовой работе
  - type: heading
    level: 1
    text: Варианты тем курсовых работ по выбору студента
  - type: heading
    level: 1
    text: Содержание разделов основной части курсовой работы
  - type: heading
    level: 1
    text: Задание на курсовую работу
  - type: heading
    level: 1
    text: Задание на групповое выполнение курсовой работы
  - type: heading
    level: 1
    text: Рецензирование и защита курсовых работ12
  - type: paragraph
    text: "Список рекомендуемой литературы\t{pageref:_Toc128712109}"
  - type: paragraph
    text: "Приложение А\t{pageref:_Toc128712110}"
  - type: paragraph
    text: "Приложение Б\t{pageref:_Toc128712111}"
  - type: paragraph
    text: "Приложение В\t16"
  - type: heading
    level: 1
    text: Требования к курсовой работе
    id: _Toc512242690
  - type: paragraph
    text: 1.1 Тема курсовой работы выдается каждому студенту индивидуально. В коллективных работах, в которых принимают участие два и более студентов, четко определяются объем и характер работы каждого студента. В задании формулируется задача и метод её решения.
  - type: paragraph
    text: Правила выбора вариантов заданий. В данных методических указаниях представлены 10 типовых вариантов заданий. Номер варианта выбирается в соответствии с порядковым номером студента в алфавитном списке группы с кратностью 10, то есть  номера по списку первых десяти студентов соответствуют номеру варианта, следующие по списку студенты, начиная с 11 и  20, получают задание по вариантам, начиная с 1-го (11-1, 12-2…., 21-1, 22-2, 23-3….).
  - type: paragraph
    text: 'Курсовая работа выполняется в течение семестра. Задание на курсовую работу выдается не позднее чем через неделю после начала семестра. Тема индивидуального задания должна быть согласована не позднее, чем за два месяца до сдачи курсовой работы. '
  - type: paragraph
    text: Работы, выполненные по несогласованным темам, не принимаются.
  - type: paragraph
    text: Защита курсовой работы осуществляется путем разъяснения информации, представленной в пояснительной записке, и  демонстрации разработанного ПО информационной системы с пояснениями по процессу разработки выполнения.
  - type: paragraph
    text: 1.2 Курсовая работа состоит из пояснительной записки, к которой прилагается диск (CD/DVD) с отлаженными программами, исходным кодом программ. Пояснительная записка может быть выполнена в виде текстового файла в формате Microsoft Word, OpenOffice или LibreOffice.
  - type: paragraph
    text: '1.3  В пояснительную записку должны входить:'
  - type: paragraph
    text: '- титульный лист (приложение А);'
  - type: paragraph
    text: '- задание на курсовую работу (приложение Б);'
  - type: paragraph
    text: '- реферат (объем пояснительной записки, количество таблиц, иллюстраций, краткая характеристика и результаты работы) (приложение В);'
  - type: paragraph
    text: '- содержание;'
  - type: paragraph
    text: '- введение;'
  - type: paragraph
    text: '- нормативные ссылки;'
  - type: paragraph
    text: '- термины и определения;'
  - type: paragraph
    text: '- сокращения;'
  - type: paragraph
    text: '- основная часть;'
  - type: paragraph
    text: '- заключение;'
  - type: paragraph
    text: '- список использованных источников;'
  - type: paragraph
    text: '- приложения.'
  - type: paragraph
    runs:
    - text: Титульный лист
      bold: true
    - text: ' оформляется в соответствии с образцом, приведенным в приложении А.'
  - type: paragraph
    runs:
    - text: 'Задание на курсовую работу '
      bold: true
    - text: оформляется в соответствии с образцом, приведенным в приложении Б.
  - type: paragraph
    runs:
    - text: 'Реферат '
      bold: true
    - text: 'должен содержать:'
  - type: paragraph
    text: '- сведения об объеме, количестве таблиц, иллюстраций, использованных источников;'
  - type: paragraph
    text: '- текст реферата. '
  - type: paragraph
    runs:
    - text: Содержание
      bold: true
    - text: ' включает заголовки всех разделов и подразделов. В конце наименования каждого раздела, каждого подраздела, приложения указывается номер листа, с которого они начинаются. Содержание'
    - text: ' '
      bold: true
    - text: 'помещается в начале пояснительной  записки и включается в общую нумерацию страниц рукописи. '
  - type: paragraph
    runs:
    - text: Во введении
      bold: true
    - text: ' кратко описывается суть решаемой в рамках курсовой работы задачи.'
  - type: paragraph
    runs:
    - text: Нормативные ссылки
      bold: true
    - text: ' оформляются так, как это показано на с. 4 данных методических указаний.'
  - type: paragraph
    runs:
    - text: 'В разделе '
    - text: термины и определения
      bold: true
    - text: ' приводят специфические для данной работы термины и определения и дают их расшифровку. Список терминов и определений составляют в алфавитном порядке.'
  - type: paragraph
    runs:
    - text: 'Раздел '
    - text: сокращения
      bold: true
    - text: ' содержит список сокращений часто встречаемых в данной работе. Список приводится в алфавитном порядке вместе с расшифровкой.'
  - type: paragraph
    runs:
    - text: Основная часть
      bold: true
    - text: ' содержит три или более раздела. Все части курсовой работы должны быть изложены в строгой логической последовательности и взаимосвязи. Каждый раздел имеет определенное целевое назначение:'
  - type: paragraph
    text: '- описание и анализ предметной области. Составляется на основе анализа литературных источников. Должны быть описаны известные решения и их сравнение. Например, методы градиентного бустинга и машины опорных векторов;'
  - type: paragraph
    text: '- математическая модель разработанного метода машинного обучения и алгоритм ее работы. Раздел должен содержать полное математическое описание и развернутый алгоритм работы предлагаемого применения метода машинного обучения;'
  - type: list
    items:
    - text: проектирование и реализация программного продукта. Построение модели ПО, диаграммы классов, выбор готовых и описание собственных алгоритмов обработки данных. Реализуется и описывается интерфейс пользователя;
      level: 1
  - type: paragraph
    text: '- экспериментальная часть. В данном разделе описываются условия проведения экспериментов для разработанной модели машинного обучения и их результаты.'
  - type: paragraph
    runs:
    - text: 'В '
    - text: заключении
      bold: true
    - text: ' приводятся главные выводы по выполненной курсовой работе.'
  - type: paragraph
    runs:
    - text: Список использованных источников.
      bold: true
    - text: ' Список должен содержать сведения об источниках, использованных в ходе выполнения курсовой работы. Источники в списке следует располагать в порядке появления ссылок на них в тексте пояснительной записки. Описания источников приводятся в соответствии с требованиями ГОСТ Р 7.0.5-2008 СИБИД. «Библиографическая ссылка. Общие требования и правила составления», и ГОСТ 7.82-2001 СИБИД. «Библиографическая запись. Библиографическое описание электронных ресурсов. Общие требования и правила составления».'
  - type: paragraph
    runs:
    - text: 'В '
    - text: приложения
      bold: true
    - text: '  выносятся исходный код программного обеспечения, таблицы результатов экспериментов и т.д.'
  - type: paragraph
    text: '1.4 Пояснительная записка должна быть оформлена на листах формата А4, имеющих поля: правое – 1,5 см, левое – 3 см, нижнее – 2,5 см, верхнее – 1,5 см. Шрифт – Times New Roman. Межстрочный интервал – полуторный. Требуемые схемы при необходимости могут быть выполнены на листах формата А3 и прикреплены в сложенном виде к пояснительной записке. '
  - type: paragraph
    text: Все листы следует сброшюровать и пронумеровать. Нумерация внизу страниц по центру. Дополнительные требования по выполнению курсовой работы выдаются руководителем работы.
  - type: heading
    level: 1
    text: Варианты тем курсовых работ по выбору студента
    id: _Toc19626626
  - type: paragraph
    text: 'Возможные варианты тем курсовой работы: '
  - type: list
    items:
    - text: Байесовская регуляризация рекуррентных нейронных сетей.
      level: 1
    - text: Анализ новостных потоков методами машинного обучения.
      level: 1
    - text: Прогнозное детектирование аномалий во временных рядах при помощи глубоких нейронных сетей.
      level: 1
    - text: Применение полных решающих деревьев в задачах регрессии.
      level: 1
    - text: Автоматическое выделение мнений в тематических моделях новостных потоков
      level: 1
    - text: Детектирование аномалий во временных рядах при помощи глубоких нейронных сетей
      level: 1
    - text: Байесовская регуляризация рекуррентных нейронных сетей.
      level: 1
    - text: Автоматическая классификация новостной информации.
      level: 1
    - text: Система классификации научных текстов.
      level: 1
    - text: Разработка алгоритма игры в шахматы с помощью метода прецедентов.
      level: 1
    - text: Классификация изображений методом байесовской классификации.
      level: 1
    - text: Исследование применимости алгоритма CART в задаче кредитного скоринга.
      level: 1
    - text: Применение алгоритма C4.5 для задачи классификации спортивных соревнований.
      level: 1
    - text: Поиск фигур технического анализа финансовых временных рядов с помощью методов машинного обучения.
      level: 1
  - type: paragraph
    text: Курсовая работа (по выбору студента) должна быть посвящена актуальной теме, практической и/или теоретической. В курсовой работе должны широко применяться методы машинного обучения.
  - type: heading
    level: 1
    text: Содержание разделов основной части курсовой работы
    id: _Toc512242692
  - type: paragraph
    text: 'Основная часть курсовой работы по дисциплине «Машинное обучение» должна состоять минимум из 3-х разделов и двух приложений (а) исходный код программного продукта и б) выборка для обучения).  '
  - type: heading
    level: 2
    text: Содержание первого раздела
  - type: paragraph
    runs:
    - text: Анализ предметной области и применимости методов машинного обучения для нее
      bold: true
      italic: true
  - type: paragraph
    text: В первом разделе описывается общая структурная схема предметной области, ставятся цели и задачи применения машинного обучения.
  - type: paragraph
    text: 'Общая схема предметной области должна включать структурную схему основных элементов (процессов) объекта с указанием внутренней структуры (существенных подсистем и элементов) и направлений движения материальных или информационных потоков. Схема должна быть снабжена текстовым пояснением. В пояснении должны быть раскрыты назначение каждого элемента и его роль в общем функционировании рассматриваемого объекта. Для каждого информационного потока в пояснении должны быть указаны: природа, носитель (способ передачи), вид / структура информации, оценочный трафик в единицах измерения, принятых или наиболее приемлемых для данного объекта (бит/байт/объектов/документов в единицу времени секунду/час/сутки).'
  - type: paragraph
    text: 'Во второй части первого раздела необходимо обосновать целесообразность применения методов машинного обучения для данной предметной области. В частности необходимо развернуто ответить на вопросы:'
  - type: paragraph
    text: Какие переменные могут служить входными данными для модели?
  - type: paragraph
    text: Какие возможности для предметной области могут появиться при использовании методов машинного обучения?
  - type: paragraph
    text: Какой дополнительный функционал может появиться при использовании методов машинного обучения?
  - type: paragraph
    text: 'Каким образом можно измерить или оценить ожидаемые результаты применения методов машинного обучения? '
  - type: paragraph
    text: 'Напомним, что методов машинного обучения довольно много, но все они решают задачи из одной из следующих категорий:'
  - type: paragraph
    text: '- задача регрессии;'
  - type: paragraph
    text: '- задача классификации;'
  - type: paragraph
    text: '- задача кластеризации;'
  - type: paragraph
    text: '- задача уменьшения размерности;'
  - type: paragraph
    text: '- задача выявления аномалий;'
  - type: paragraph
    text: 'При этом сами методы машинного обучения делятся на два вида: обучение с учителем (supervised learning) либо без него (unsupervised learning). В обоих видах обучения машине предоставляются исходные данные, которые ей предстоит проанализировать и найти закономерности. Различие лишь в том, что при обучении с учителем есть ряд гипотез, которые необходимо опровергнуть или подтвердить.'
  - type: paragraph
    text: 'Основные алгоритмы машинного обучения:'
  - type: paragraph
    text: '- дерево принятий решений;'
  - type: paragraph
    text: '- наивная байесовская классификация;'
  - type: paragraph
    text: '- методы математической статистики;'
  - type: paragraph
    text: '- метод опорных векторов и некоторые др.;'
  - type: paragraph
    text: В текст первого раздела целесообразно вставлять диаграммы, выполненные по стандарту IDEF0, с помощью которых можно описать бизнеспроцессы. IDEFдиаграммы можно создать с помощью программы BPwin или другого специализированного программного обеспечения.
  - type: heading
    level: 2
    text: Содержание второго раздела
  - type: paragraph
    runs:
    - text: Разработанная модель машинного обучения и алгоритм ее работы
      bold: true
      italic: true
  - type: paragraph
    text: Во втором разделе необходимо привести разработанную модель машинного обучения и алгоритм ее работы. Раздел должен содержать полное математическое описание и развернутый алгоритм работы предлагаемого применения метода машинного обучения.
  - type: paragraph
    text: 'Процесс решения задачи с помощью машинного обучения обычно состоит из следующих шагов:'
  - type: paragraph
    text: '- сбор данных;'
  - type: paragraph
    text: '- очистка и форматирование данных;'
  - type: paragraph
    text: '- предварительный анализ данных;'
  - type: paragraph
    text: '- выбор значимых признаков;'
  - type: paragraph
    text: '- сравнение качества работы нескольких моделей;'
  - type: paragraph
    text: '- оптимизация гиперпараметров в лучшей модели;'
  - type: paragraph
    text: '- проверка модели на валидационной выборке;'
  - type: paragraph
    text: '- интерпретация результатов;'
  - type: paragraph
    text: '- итоговое графическое и табличное представление результатов работы.'
  - type: paragraph
    text: В разделе должны быть описаны ограничения модели и ограничения по входным данным.
  - type: paragraph
    text: Например, рассматривается скоринговая задача – определение можно ли выдать кредит или нет. Лица, запрашивающие у банка заём, – это объекты, а вот признаки будут отличаться в зависимости от того, физическое это лицо или юридическое. Признаковое описание частного лица, претендующего на кредит, формируется на основе данных анкеты, которую оно заполняет. Затем анкета дополняется некоторыми другими сведениями о потенциальном клиенте, которые банк получает по своим каналам. Часть из них относятся к бинарным признакам (пол, наличие телефонного номера), другие — к порядковым (образование, должность), большинство же являются количественными (величина займа, общая сумма задолженностей по другим банкам, возраст, количество членов семьи, доход, трудовой стаж) или номинальными (имя, название фирмы-работодателя, профессия, адрес). Для машинного обучения составляется выборка, в которую входят кредитополучатели, чья кредитная история известна. Все заёмщики делятся на классы, в простейшем случае их 2 – «хорошие» заёмщики и «плохие», и положительное решение о выдаче кредита принимается только в пользу «хороших». В более сложном алгоритме предусматривается начисление каждому заёмщику условных баллов за каждый признак, и решение о предоставлении кредита будет зависеть от суммы набранных баллов. Во время машинного обучения системы кредитного скоринга вначале назначают некоторое количество баллов каждому признаку, а затем определяют условия выдачи займа (срок, процентную ставку и остальные параметры, которые отражаются в кредитном договоре){footnote:fn1}.
  - type: paragraph
    text: Метод машинного обучения целесообразно реализовывать на языке программирования Python или R (но ограничений на применимость RAD – средств и языков программирования в курсовой работе не накладывается).
  - type: heading
    level: 2
    text: Содержание третьего раздела
  - type: paragraph
    runs:
    - text: Экспериментальная часть
      bold: true
      italic: true
  - type: paragraph
    text: В данном разделе должны быть представлены результаты экспериментов применимости предложенного метода (-ов) машинного обучения для выбранной задачи.
  - type: paragraph
    text: ' В данном разделе обязательно должна быть отражена следующая информация:'
  - type: paragraph
    text: '- требования к аппаратному и программному обеспечению;'
  - type: paragraph
    text: '- условия и способ проведения экспериментов;'
  - type: paragraph
    text: '- описание постановки эксперимента;'
  - type: paragraph
    text: '- экспериментальные данные (выборка), возможно, статистические показатели и распределения;'
  - type: paragraph
    text: '- действия пользователя для реализации команд и функций, указанных в задании, согласно варианту или поставленным требованиям, а также дополнительные контекстные действия.'
  - type: paragraph
    text: 'Должны быть представлены изображения экрана в момент  выполнения пользователем требуемых действий и изображения экрана при выводе информации с результатами обработки программой команды пользователя. '
  - type: paragraph
    text: Изображения должны иметь пояснения о соответствующем действии пользователя или программы и используемых функциях автоматизации или событиях при генерации и выполнении этого действия.
  - type: heading
    level: 1
    text: Задания на курсовую работу
  - type: paragraph
    text: Варианты объектов проектирования и автоматизации (основной вариант) представлены в таблице 1.
  - type: paragraph
    text: Т а б л и ц а 1
  - type: paragraph
    text: Варианты предметных областей
  - type: table
    data:
    - - № варианта
      - Объект автоматизации
    - - '1'
      - Финансовые рынки
    - - '2'
