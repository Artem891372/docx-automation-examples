    - - '5'
      - Анализ научных публикаций
    - - '6'
      - Социальные процессы муниципалитета
    - - '7'
      - Классификация регионов по социально – экономическим показателям
    - - '8'
      - Анализ геоданных
    - - '9'
      - Анализ картографической информации
    - - '10'
      - Анализ медицинских данных
  - type: paragraph
    text: Во всех вариантах необходимо предварительно изучить предметную область и составить структурно–функциональные схемы бизнес–процессов.
  - type: paragraph
    text: Дополнительную информацию можно получить у преподавателя или на предприятиях, осуществляющих соответствующий вид деятельности.
  - type: paragraph
    text: При реализации заданий необходимо следовать указаниям по правилам оформления интерфейсов ввода, вывода и культуре программирования, изложенным в курсе лекций и лабораторных работах по дисциплине «Проектирование информационных систем».
  - type: paragraph
    runs:
    - text: Пример составления технического задания
      bold: true
  - type: paragraph
    text: Техническое задание на курсовую работу необходимо составлять по ГОСТ 34.602. Шаблон технического задания на разрабатываемое ПО приводится в приложении Г пояснительной записки.
  - type: heading
    level: 1
    text: Задание на групповое выполнение курсовой работы
    id: _Toc512242694
  - type: paragraph
    text: Цель данного варианта выполнения курсовой работы состоит в формировании навыков совместной, групповой работы студентов при разработке программного обеспечения. В данном варианте задания взаимодействуют два студента.
  - type: paragraph
    text: 'Принцип выполнения группового курсовой работы в следующем:'
  - type: list
    items:
    - text: Один студент выдает техническое задание второму студенту.
      level: 1
    - text: Второй студент принимает техническое задание, уточняет детали и разрабатывает программное обеспечение согласно техническому заданию.
      level: 1
  - type: paragraph
    text: 'При этом второй студент также разрабатывает техническое задание на программное обеспечение и передает его первому студенту. То есть каждый студент выступает и в роли Заказчика, и в роли Разработчика. Соответственно основная часть пояснительной записки каждого из студентов содержит две части:'
  - type: list
    items:
    - text: Часть А. Техническое задание от другого студента.
      level: 1
    - text: Часть Б. Описание реализации программного обеспечения по полученному техническому заданию.
      level: 1
  - type: paragraph
    text: Оценки за групповую курсовую работу студенты получают раздельно, при этом комплексно учитываются написанное техническое задание для другого студента и собственное разработанное программное обеспечение.
  - type: heading
    level: 1
    text: Рецензирование и защита курсовых работ
    id: _Toc512242695
  - type: paragraph
    text: Выполненную курсовую работу студент предоставляет научному руководителю. В рецензии преподаватель указывает достоинства и недостатки работы, как по содержанию, так и по форме. Если оценка положительна, то работа допускается к защите. Если работа не отвечает требованиям, то она возвращается студенту для доработки. К повторной проверке обязательно прилагается рецензия на первый вариант.
  - type: paragraph
    text: В случае допуска курсовой работы к защите студенту необходимо внимательно ознакомиться с рецензией, так как в ней даются рекомендации по устранению имеющихся недостатков и приводится анализ положительных сторон работы, которые необходимо учесть при подготовке к защите курсовой работы.
  - type: paragraph
    text: После защиты курсовая работа получает окончательную оценку, которая заносится в экзаменационную ведомость и зачетную книжку студента.
