document:
  type: section
  content:
  # =====================================================================
  # РЕФЕРАТ
  # =====================================================================
  - type: heading
    level: 0
    text: Реферат
  - type: paragraph
    text: "Курсовая работа содержит 38 с., {IMAGES_COUNT} рис., {TABLES_COUNT} таблиц, {SOURCES_COUNT} источников, {APPENDIX_COUNT} приложение."
  - type: paragraph
    text: "Ключевые слова: классификация обращений, машинное обучение, TF-IDF, мобильный банк, техническая поддержка, маршрутизация инцидентов, обработка естественного языка, метод опорных векторов, градиентный бустинг."
  - type: paragraph
    text: "Объект исследования — процесс обработки текстовых обращений клиентов в техническую поддержку мобильного банковского приложения. Предмет исследования — методы и алгоритмы машинного обучения для многоклассовой классификации обращений по типу технической неполадки."
  - type: paragraph
    text: "Цель работы — разработка и экспериментальная оценка системы автоматической классификации технических неполадок в обращениях клиентов мобильного банка для автоматизированной маршрутизации заявок в специализированные группы поддержки."
  - type: paragraph
    text: "В работе выполнены: анализ предметной области и обзор существующих подходов к классификации обращений в техподдержку; математическое описание TF-IDF-векторизации и пяти классификаторов; разработка алгоритма предобработки русскоязычных обращений; экспериментальная оценка на синтетическом датасете из 1632 обращений по шести категориям; сравнительный анализ метрик качества; реализация веб-приложения техподдержки на Flask."
  - type: paragraph
    text: "Практическая значимость работы состоит в возможности интеграции разработанной модели в системы маршрутизации обращений банковской техподдержки, что позволяет сократить долю заявок, требующих переадресации, и снизить среднее время реакции на обращение клиента."

  # =====================================================================
  # СОДЕРЖАНИЕ
  # =====================================================================
  - type: heading
    level: 0
    text: Содержание

  # =====================================================================
  # ВВЕДЕНИЕ
  # =====================================================================
  - type: heading
    level: 0
    text: Введение
  - type: paragraph
    text: "Дистанционное банковское обслуживание (ДБО) стало основным каналом взаимодействия клиентов с банками: по данным Банка России [1], доля активных пользователей мобильных банковских приложений в Российской Федерации в 2024 году превысила 80% совершеннолетнего населения, а количество финансовых операций, выполняемых через мобильные приложения, составляет от 300 до 500 миллионов в сутки в крупнейших банках. Положение Банка России от 12.01.2022 № 787-П [2] устанавливает требования к обеспечению операционной надёжности при осуществлении банковской деятельности и обязывает кредитные организации поддерживать установленные показатели качества обслуживания, в том числе по времени реагирования на технические инциденты."
  - type: paragraph
    text: "В условиях массового внедрения дистанционных каналов обслуживания технические неполадки в мобильном банковском приложении — отказы аутентификации, ошибки платежей, проблемы с отображением карт, сбои сетевого взаимодействия — формируют поток клиентских обращений в техническую поддержку объёмом от нескольких тысяч до десятков тысяч заявок в сутки [3]. Согласно отраслевым исследованиям 2024–2025 годов [4], корректная классификация типа обращения на первой линии и маршрутизация заявки в специализированную группу определяет до 60% общего времени её решения. Ошибочная классификация приводит к двойной переадресации, нарушению SLA и снижению индекса удовлетворённости клиентов (NPS)."
  - type: paragraph
    text: "В условиях ужесточения регуляторных требований 2024–2026 годов — ввода в действие Положения № 787-П [2] и обновления стандарта ГОСТ Р ИСО/МЭК 20000-1-2021 [5] по управлению ИТ-услугами — автоматизация первичной обработки обращений становится для банков не вспомогательной, а основной задачей операционной устойчивости. Применение методов машинного обучения для классификации текстовых обращений позволяет сократить долю заявок, требующих ручной маршрутизации, в 3–5 раз и обеспечить устойчивое соблюдение SLA [6]."
  - type: paragraph
    text: "Цель работы — разработка и экспериментальная оценка системы автоматической классификации технических неполадок в обращениях клиентов мобильного банка для автоматизированной маршрутизации заявок в специализированные группы технической поддержки."
  - type: paragraph
    text: "Для достижения поставленной цели решаются следующие задачи:"
  - type: list
    items:
    - text: "провести анализ предметной области и обосновать актуальность задачи автоматической классификации технических обращений в банковском приложении;"
      level: 1
    - text: "выполнить обзор и сравнительный анализ существующих методов классификации обращений в техническую поддержку;"
      level: 1
    - text: "обосновать выбор методов машинного обучения и схемы признакового описания для русскоязычных обращений клиентов банка;"
      level: 1
    - text: "дать математическое описание TF-IDF-векторизации и выбранных классификаторов;"
      level: 1
    - text: "разработать алгоритм предобработки текста, построения и оценки классификационной модели;"
      level: 1
    - text: "провести экспериментальную оценку системы на синтетическом датасете обращений с применением пяти алгоритмов классификации;"
      level: 1
    - text: "реализовать веб-приложение оператора техподдержки, демонстрирующее работу классификатора в режиме онлайн."
      level: 1
  - type: paragraph
    text: "Объект исследования — процесс обработки текстовых обращений клиентов в техническую поддержку мобильного банковского приложения. Предмет исследования — методы и алгоритмы машинного обучения для многоклассовой классификации обращений по типу технической неполадки."
  - type: paragraph
    text: "Научная новизна работы состоит в сравнительной оценке пяти классических алгоритмов классификации — наивного байесовского классификатора, логистической регрессии, метода опорных векторов, случайного леса и градиентного бустинга — применительно к задаче типизации технических обращений в мобильном банке с учётом неустранимой неоднозначности части обращений (label noise)."
  - type: paragraph
    text: "Практическая значимость работы состоит в том, что разработанный классификатор и реализованное веб-приложение могут быть интегрированы в системы автоматизированной маршрутизации обращений банковской техподдержки, обеспечивая снижение нагрузки на специалистов первой линии и сокращение среднего времени реакции на обращение."
  - type: paragraph
    text: "Работа состоит из введения, шести глав основной части, заключения, списка использованных источников и приложения с исходным кодом разработанной системы."

  # =====================================================================
  # ГЛАВА 1: Нормативные ссылки
  # =====================================================================
  - type: heading
    level: 1
    text: Нормативные ссылки
  - type: paragraph
    text: "В настоящей курсовой работе использованы ссылки на следующие нормативные документы:"
  - type: list
    items:
    - text: "ГОСТ Р 7.0.100-2018. Библиографическая запись. Библиографическое описание. Общие требования и правила составления."
      level: 1
    - text: "ГОСТ Р ИСО/МЭК 20000-1-2021. Информационные технологии. Управление услугами. Часть 1. Требования к системе менеджмента услуг."
      level: 1
    - text: "ГОСТ Р 56939-2016. Защита информации. Разработка безопасного программного обеспечения. Общие требования."
      level: 1
    - text: "Федеральный закон от 27.07.2006 № 152-ФЗ «О персональных данных» (в ред. от 08.08.2024)."
      level: 1
    - text: "Положение Банка России от 12.01.2022 № 787-П «Об обязательных для кредитных организаций требованиях к операционной надёжности при осуществлении банковской деятельности в целях обеспечения непрерывности оказания банковских услуг»."
      level: 1

  # =====================================================================
  # ГЛАВА 2: Термины и определения
  # =====================================================================
  - type: heading
    level: 1
    text: Термины и определения
  - type: paragraph
    text: "Машинное обучение (Machine Learning) — раздел искусственного интеллекта, в котором алгоритмы обучаются выполнять задачи на основе данных без явного программирования правил для каждого случая."
  - type: paragraph
    text: "Многоклассовая классификация — задача машинного обучения с учителем, в которой объекту назначается одна метка из заранее определённого множества из K ≥ 3 классов."
  - type: paragraph
    text: "Техническая неполадка в банковском приложении — нарушение штатной работы мобильного банковского приложения, выявляемое клиентом и приводящее к обращению в техническую поддержку."
  - type: paragraph
    text: "Маршрутизация обращения (тикета) — процесс назначения обращения клиента в техническую поддержку соответствующей группе специалистов или конкретному инженеру в зависимости от категории неполадки."
  - type: paragraph
    text: "TF-IDF (Term Frequency — Inverse Document Frequency) — статистическая мера значимости слова в документе относительно коллекции документов, используемая для взвешивания признаков при классификации текста."
  - type: paragraph
    text: "Векторизация текста — преобразование текстового документа в числовой вектор признаков, пригодный для обработки алгоритмами машинного обучения."
  - type: paragraph
    text: "Перекрёстная проверка (k-fold Cross-Validation) — метод оценки обобщающей способности модели, при котором выборка делится на k равных частей и модель последовательно обучается на k−1 частях, а проверяется на оставшейся."
  - type: paragraph
    text: "F1-мера — гармоническое среднее точности (Precision) и полноты (Recall), применяемое для оценки качества классификации, особенно при несбалансированных классах и многоклассовой постановке."
  - type: paragraph
    text: "Матрица ошибок (Confusion Matrix) — таблица, отображающая соотношение истинно и ложно классифицированных объектов для каждого класса и позволяющая рассчитать основные метрики качества."
  - type: paragraph
    text: "Соглашение об уровне обслуживания (SLA) — формализованное обязательство поставщика ИТ-услуг по поддержанию установленных показателей качества, включая максимальное время реакции и время разрешения инцидента."

  # =====================================================================
  # ГЛАВА 3: Сокращения и обозначения
  # =====================================================================
  - type: heading
    level: 1
    text: Сокращения и обозначения
  - type: paragraph
    text: "МО — машинное обучение."
  - type: paragraph
    text: "ИИ — искусственный интеллект."
  - type: paragraph
    text: "NLP — Natural Language Processing, обработка естественного языка."
  - type: paragraph
    text: "TF-IDF — Term Frequency — Inverse Document Frequency, частота термина — обратная частота документа."
  - type: paragraph
    text: "SVM — Support Vector Machine, метод опорных векторов."
  - type: paragraph
    text: "NB — Naive Bayes, наивный байесовский классификатор."
  - type: paragraph
    text: "LR — Logistic Regression, логистическая регрессия."
  - type: paragraph
    text: "RF — Random Forest, случайный лес."
  - type: paragraph
    text: "GBM — Gradient Boosting Machine, градиентный бустинг."
  - type: paragraph
    text: "CV — Cross-Validation, перекрёстная проверка."
  - type: paragraph
    text: "TP — True Positive, истинно положительный результат классификации."
  - type: paragraph
    text: "TN — True Negative, истинно отрицательный результат классификации."
  - type: paragraph
    text: "FP — False Positive, ложноположительный результат классификации."
  - type: paragraph
    text: "FN — False Negative, ложноотрицательный результат классификации."
  - type: paragraph
    text: "ДБО — дистанционное банковское обслуживание."
  - type: paragraph
    text: "СБП — Система быстрых платежей."
  - type: paragraph
    text: "API — Application Programming Interface, программный интерфейс приложения."
  - type: paragraph
    text: "SLA — Service Level Agreement, соглашение об уровне обслуживания."
  - type: paragraph
    text: "NPS — Net Promoter Score, индекс лояльности клиентов."
  - type: paragraph
    text: "JSON — JavaScript Object Notation, текстовый формат обмена данными."

  # =====================================================================
  # ГЛАВА 4: Анализ предметной области
  # =====================================================================
  - type: heading
    level: 1
    text: Анализ предметной области

  - type: heading
    level: 2
    text: Постановка и описание задачи

  - type: heading
    level: 3
    text: Масштаб проблемы и экономическая значимость
  - type: paragraph
    text: "Дистанционное банковское обслуживание (ДБО) в Российской Федерации в 2024–2025 годах окончательно стало основным каналом взаимодействия клиентов с банками. По данным официальной статистики Банка России [1], число активных пользователей мобильных банковских приложений превысило 80% совершеннолетнего населения, а суммарное количество финансовых операций, выполняемых в мобильных приложениях крупнейших банков, составляет от 300 до 500 миллионов в сутки. На этом фоне поток обращений в техническую поддержку, связанных именно с работой мобильного приложения, занимает в крупных банках от 40 до 60% всего объёма входящих контактов клиентов [3]."
  - type: paragraph
    text: "Стоимость одной обработанной заявки в техподдержке банка зависит от канала и формы обращения, однако отраслевые оценки 2024–2025 годов [4] показывают, что среднее время на первичную классификацию и маршрутизацию обращения через колл-центр составляет от 3 до 7 минут на оператора. При среднем потоке 15–25 тысяч обращений в сутки в крупном банке только на первичную сортировку требуется до 1200 человеко-часов рабочего времени операторов первой линии ежедневно. По отраслевым оценкам [7], автоматизация распознавания темы обращения позволяет сократить эту нагрузку на 60–70% и довести среднее время первичного отклика до уровня менее одной минуты."
  - type: paragraph
    text: "С регуляторной точки зрения автоматизация классификации обращений становится не вспомогательной, а основной задачей. Положение Банка России от 12.01.2022 № 787-П [2] устанавливает обязательные требования к операционной надёжности кредитных организаций, в том числе по времени восстановления критически важных процессов и времени реакции на инциденты. ГОСТ Р ИСО/МЭК 20000-1-2021 [5] определяет требования к системе менеджмента ИТ-услуг и устанавливает необходимость классификации, приоритизации и маршрутизации обращений на стадии регистрации. Соблюдение этих требований при потоке десятков тысяч обращений в сутки невозможно обеспечить ручными методами."
  - type: paragraph
    text: "Помимо требований регулятора, существенным является и репутационный фактор. Согласно отраслевому отчёту Markswebb «Mobile Banking Rank 2024» [4], одной из ключевых жалоб клиентов на банковские приложения остаётся длительное время реакции технической поддержки и многократная переадресация заявки между группами. Каждая повторная переадресация увеличивает время разрешения инцидента и снижает индекс удовлетворённости клиента (NPS). Корректная классификация обращения на первой линии и его автоматическая маршрутизация в специализированную группу прямо влияют на ключевые KPI техподдержки."

  - type: heading
    level: 3
    text: Типология технических неполадок мобильного банка
  - type: paragraph
    text: "Типология технических обращений клиентов в техническую поддержку банка является устоявшейся: на основании анализа открытых отчётов и публикаций [3, 4, 7] можно выделить шесть устойчивых категорий, на которые приходится более 95% всех технических обращений. Эта классификация лежит в основе обучающей разметки в данной работе. Краткая характеристика категорий и примеры обращений приведены в таблице {ref:tbl_categories}."
  - type: paragraph
    text: "В таблице {ref:tbl_categories} показаны категории технических неполадок и характерные формулировки обращений клиентов мобильного банка."
  - type: table
    caption: Категории технических неполадок и примеры обращений клиентов
    id: tbl_categories
    data:
    - ["Категория", "Доля потока, %", "Целевая группа поддержки", "Типовой пример обращения клиента"]
    - ["Аутентификация", "12–18", "Группа аутентификации, 1-я линия", "После обновления приложения не принимает PIN-код, биометрия не работает"]
    - ["Платежи и переводы", "22–30", "Платёжный департамент, SLA 30 минут", "Перевод по СБП на 5 000 рублей завис уже 30 минут, деньги не дошли"]
    - ["Производительность", "10–14", "Команда мониторинга мобильного приложения", "Главный экран приложения после обновления стал грузиться более 30 секунд"]
    - ["Интерфейс", "10–15", "Группа фронтенда (Android / iOS)", "В тёмной теме часть текста на главном экране белый шрифт на белом фоне"]
    - ["Сетевые ошибки", "12–18", "Сетевой отдел, эскалация в NOC", "Постоянно пишет «Сервис временно недоступен», хотя интернет работает"]
    - ["Банковские карты", "12–18", "Карточный департамент, эскалация в процессинг", "После перевыпуска не вижу новую карту в приложении, реквизиты пустые"]
  - type: paragraph
    text: "Категория «Платежи и переводы» формирует наибольшую долю обращений и обладает наивысшим приоритетом маршрутизации: SLA на её обработку обычно устанавливается на уровне 30 минут от момента поступления обращения. Категории «Аутентификация», «Сетевые ошибки» и «Банковские карты» составляют основу нагрузки первой линии поддержки. Категории «Производительность» и «Интерфейс» обычно эскалируются в инженерные команды разработки приложения и редко требуют быстрой ответной коммуникации с клиентом, однако служат важным источником данных для команды разработки."

  - type: heading
    level: 3
    text: Обоснование необходимости автоматизации
  - type: paragraph
    text: "Для формализации требований к разрабатываемой системе классификации необходимо описать основные сценарии её использования. На рисунке {ref:fig_usecase} представлена диаграмма вариантов использования, отражающая взаимодействие основных ролей системы: оператора первой линии, регистрирующего обращение, специалиста профильной группы поддержки и администратора, ответственного за настройку и обновление классификационной модели."
  - type: image
    width_in: 5
    image:
      diagram:
        diagram_type: kroki
        kroki_type: plantuml
        filename: usecase_bank_issues
        image_type: png
        index: 1
        code: |
          @startuml
          top to bottom direction
          actor "Оператор 1-й линии" as op
          actor "Специалист группы" as spec
          actor "Администратор" as adm
          rectangle "Система классификации обращений" {
            usecase "Регистрация обращения" as UC1
            usecase "Классификация" as UC2
            usecase "Маршрутизация" as UC3
            usecase "Обработка заявки" as UC4
            usecase "Просмотр статистики" as UC5
            usecase "Обновление модели" as UC6
          }
          op --> UC1
          UC1 .> UC2 : <<include>>
          UC2 .> UC3 : <<include>>
          spec --> UC4
          adm --> UC5
          adm --> UC6
          @enduml
  - type: figure_caption
    text: Диаграмма вариантов использования системы классификации обращений
    id: fig_usecase
  - type: paragraph
    text: "Ручная классификация обращений на первой линии имеет три принципиальных ограничения. Во-первых, при потоке свыше 1500 обращений в час оператор не успевает прочитывать сообщение целиком и опирается на ключевые слова, что приводит к ошибочной маршрутизации в 12–18% случаев [4]. Во-вторых, классификация требует устойчивого знания внутренней структуры подразделений банка и матрицы маршрутизации, что увеличивает срок обучения новых сотрудников и снижает производительность в период текучки персонала. В-третьих, ручная сортировка не масштабируется на круглосуточный режим: ночные смены вынужденно работают с пониженной численностью, что приводит к накоплению очереди и нарушению SLA по приоритетным категориям."
  - type: paragraph
    text: "Автоматизация классификации обращений на основе методов машинного обучения снимает все три ограничения. Модель работает с постоянной производительностью независимо от времени суток, не зависит от текущего состава операторов и обеспечивает воспроизводимое качество. По оценкам [6, 7], внедрение даже простой модели на основе TF-IDF и линейного классификатора сокращает долю ошибочно маршрутизированных обращений в 3–5 раз и сокращает среднее время первичной маршрутизации с 3–5 минут до десятков секунд."

  - type: heading
    level: 2
    text: Обзор существующих подходов

  - type: heading
    level: 3
    text: Методы на основе правил и ключевых слов
  - type: paragraph
    text: "Исторически первым и наиболее распространённым подходом к классификации обращений в техническую поддержку являются методы на основе правил и словарей ключевых слов. Реализация подобных систем сводится к составлению списка терминов, характерных для каждой категории неполадок, и применению регулярных выражений или булевых правил для отнесения обращения к соответствующему классу [8]. Преимущество данного подхода — высокая интерпретируемость и низкие вычислительные затраты: правило для каждой категории формулируется явно и может быть проверено вручную."
  - type: paragraph
    text: "Однако правила имеют ряд существенных недостатков. Во-первых, они плохо переносят синонимию и вариативность естественного языка: обращение «не могу залогиниться» не будет распознано правилом, рассчитанным на ключевое слово «вход». Во-вторых, при увеличении числа категорий и сложности словаря правила вступают в противоречие друг с другом, что требует ручного управления приоритетами. В-третьих, поддержание актуальности словарей становится отдельной операционной задачей: появление новой функции в мобильном приложении немедленно приводит к появлению новых формулировок обращений, не покрываемых старыми правилами. По данным [9], точность правил-based систем классификации обращений в технической поддержке обычно не превышает 65–75%."

  - type: heading
    level: 3
    text: Классические методы машинного обучения
  - type: paragraph
    text: "Классические методы машинного обучения для классификации текстов основываются на представлении документа в виде вектора признаков с последующим применением алгоритма с учителем. Современная парадигма, описанная в фундаментальной монографии Manning, Raghavan и Schütze «Introduction to Information Retrieval» [10], предполагает использование схемы TF-IDF для взвешивания терминов и одного из четырёх классов алгоритмов: вероятностного (Naive Bayes), линейного (Logistic Regression, SVM), ансамблевого (Random Forest, Gradient Boosting) и метрического (k-NN)."
  - type: paragraph
    text: "Joachims [11] в фундаментальной работе показал, что метод опорных векторов с линейным ядром обеспечивает наивысшее качество классификации в задачах с большим числом редко встречающихся признаков, типичных для текстовой обработки. Sebastiani [12] в обзоре методов автоматической текстовой классификации систематизировал применение классических алгоритмов и показал, что для задач технической поддержки с числом классов от 5 до 20 наиболее эффективны линейные модели и ансамбли деревьев. По данным обзора Aggarwal и Zhai [13], классические методы на TF-IDF-признаках достигают F1-меры 0,90–0,95 на реальных корпусах коротких текстовых обращений."

  - type: heading
    level: 3
    text: Глубокое обучение
  - type: paragraph
    text: "В последние годы для задач классификации текстов получили распространение методы глубокого обучения, в первую очередь предобученные языковые модели на основе архитектуры Transformer. Model BERT [14] и её специализированные адаптации для русского языка (RuBERT, RuRoBERTa) демонстрируют качество классификации, превосходящее классические методы на 1–3 процентных пункта по F1-мере [15]. Однако применение глубоких моделей в задачах банковской техподдержки сопряжено с тремя существенными ограничениями."
  - type: paragraph
    text: "Во-первых, инференс на BERT-подобных моделях даже на CPU занимает 50–200 мс на одно обращение, что при потоке десятков тысяч обращений в сутки требует развёртывания GPU-кластера или специализированного оборудования. Во-вторых, тонкая настройка (fine-tuning) BERT требует не менее 5000–10000 размеченных примеров на класс [15], что не всегда достижимо при холодном старте системы. В-третьих, для регулируемых отраслей, к которым относится банковский сектор, важна интерпретируемость решения: для классических моделей на TF-IDF возможен анализ вклада конкретных слов, для BERT — только косвенно через механизмы внимания. По этим причинам в данной работе глубокое обучение рассматривается как обзорный подход, но не реализуется."

  - type: heading
    level: 3
    text: Сравнительный анализ подходов
  - type: paragraph
    text: "Сравнительный анализ рассмотренных подходов по ключевым критериям применимости в задаче классификации обращений банковской техподдержки приведён в таблице {ref:tbl_approaches}."
  - type: table
    caption: Сравнительный анализ методов классификации технических обращений
    id: tbl_approaches
    data:
    - ["Метод", "Точность", "Интерпретируемость", "Вычисл. затраты", "Применимость"]
    - ["Правила и ключевые слова", "Низкая (65–75%)", "Высокая", "Низкие", "Холодный старт"]
    - ["Наивный Байес + TF-IDF", "Высокая (88–93%)", "Средняя", "Низкие", "Базовая линия"]
    - ["Логистическая регрессия", "Высокая (90–94%)", "Высокая", "Низкие", "Продакшн"]
    - ["Метод опорных векторов", "Высокая (91–95%)", "Средняя", "Низкие", "Продакшн"]
    - ["Случайный лес", "Высокая (90–94%)", "Средняя", "Средние", "Робастность"]
    - ["Градиентный бустинг", "Очень высокая (92–96%)", "Низкая", "Высокие", "Качество в приоритете"]
    - ["BERT / RuBERT", "Наивысшая (93–97%)", "Очень низкая", "Высокие (GPU)", "Большие данные"]
  - type: paragraph
    text: "На основании приведённого анализа в качестве базового подхода в данной работе выбрана связка TF-IDF + классические алгоритмы машинного обучения. Этот выбор обеспечивает баланс между качеством, интерпретируемостью и стоимостью внедрения, что критически важно для систем реального времени в банковской техподдержке."

  - type: heading
    level: 2
    text: Применимость машинного обучения к задаче

  - type: heading
    level: 3
    text: Входные признаки и признаковое описание
  - type: paragraph
    text: "Входными данными системы являются текстовые обращения клиентов на русском языке. Анализ примеров обращений показывает, что средняя длина обращения составляет от 10 до 80 слов; обращения содержат специфическую финансовую лексику (СБП, баланс, выписка, реквизиты), номера ошибок (Ошибка 500, Сервис недоступен), цифровые литералы (суммы операций, длительности ожидания), а также бытовую разговорную лексику (тормозит, висит, не работает). Эта смешанная природа обращений делает невозможным применение строгих лингвистических правил и требует статистических методов."
  - type: paragraph
    text: "В качестве признакового представления выбрана схема TF-IDF с биграммами и нормализацией. Эта схема обеспечивает три полезных свойства. Во-первых, частые служебные слова получают низкие веса за счёт обратной частоты документа, что снижает влияние шума. Во-вторых, биграммы позволяют учесть устойчивые сочетания (например, «PIN-код», «не приходит», «истории операций»), которые в одиночных словах теряются. В-третьих, разреженность TF-IDF-векторов делает возможным применение линейных моделей с очень большим словарём (десятки тысяч признаков) без переобучения."

  - type: heading
    level: 3
    text: Тип задачи МО и постановка
  - type: paragraph
    text: "Формально задача относится к многоклассовой классификации текстов с учителем (supervised multi-class text classification). Пусть задано множество обращений X = {x_1, …, x_n}, каждому из которых соответствует одна метка y_i из множества классов C = {c_1, …, c_K}, где K = 6 — число категорий технических неполадок. Требуется построить функцию f: X → C, минимизирующую ожидаемое значение функции потерь на новых, ранее не виденных обращениях."
  - type: paragraph
    text: "Постановка является многоклассовой, а не бинарной, поскольку категории неполадок взаимно исключают друг друга в смысле маршрутизации: каждое обращение направляется в одну группу поддержки. При этом постановка не является многометочной (multi-label), хотя в редких случаях обращение содержит признаки сразу двух категорий — такие обращения в данной работе отнесены к более приоритетной группе (как правило, к «Платежам»). Распределение классов в обучающей выборке считается приблизительно равномерным, поэтому в качестве основной метрики оптимизации выбрана F1-macro, не дающая преимущества крупным классам."

  - type: heading
    level: 3
    text: Метрики оценки результата
  - type: paragraph
    text: "Для оценки качества разработанной системы используются стандартные метрики многоклассовой классификации, основанные на матрице ошибок. В качестве основной метрики выбрана общая точность классификации (Accuracy), определяемая формулой ({ref:eq_accuracy})."
  - type: math
    formula: "Acc = \\frac{TP + TN}{TP + TN + FP + FN}"
    id: eq_accuracy
  - type: paragraph
    text: "Поскольку даже сбалансированная выборка не гарантирует одинакового качества по всем классам, основной метрикой оптимизации в данной работе является F1-macro — среднее значение F1-меры по всем классам, рассчитываемое по формуле ({ref:eq_f1})."
  - type: math
    formula: "F_1 = \\frac{2 \\cdot Precision \\cdot Recall}{Precision + Recall} = \\frac{2TP}{2TP + FP + FN}"
    id: eq_f1
  - type: paragraph
    text: "Использование F1-macro в качестве основной метрики оптимизации обусловлено двумя соображениями. Во-первых, F1-мера учитывает одновременно ошибки первого (FP) и второго (FN) рода, что критично для задачи маршрутизации: ложноположительная классификация приводит к загрузке непрофильной группы, а ложноотрицательная — к нарушению SLA для пострадавшей категории. Во-вторых, F1-macro не даёт преимущества крупным классам и тем самым стимулирует модель одинаково хорошо различать как массовые (платежи), так и менее частотные (интерфейс) категории неполадок."

  # =====================================================================
  # ГЛАВА 5: Разработка модели машинного обучения
  # =====================================================================
  - type: heading
    level: 1
    text: Разработка модели машинного обучения

  - type: heading
    level: 2
    text: Математическое описание алгоритмов

  - type: heading
    level: 3
    text: Признаковое представление TF-IDF
  - type: paragraph
    text: "Признаковое представление текстов в работе строится по схеме TF-IDF с биграммами и сублинейным масштабированием. Базовая величина TF(t, d) — частота терма t в документе d — определяется формулой ({ref:eq_tf})."
  - type: math
    formula: "tf(t, d) = \\frac{f_{t,d}}{\\sum_{t' \\in d} f_{t',d}}"
    id: eq_tf
  - type: paragraph
    runs:
      - text: "где "
      - math: "f_{t,d}"
      - text: " — число вхождений терма t в документ d, "
      - math: "\\sum_{t' \\in d} f_{t',d}"
      - text: " — суммарное число словоупотреблений в документе d."
  - type: paragraph
    text: "Обратная частота документа IDF(t) учитывает редкость терма во всей коллекции D и рассчитывается по формуле ({ref:eq_idf})."
  - type: math
    formula: "idf(t, D) = \\log \\frac{|D|}{1 + |\\{d \\in D : t \\in d\\}|}"
    id: eq_idf
  - type: paragraph
    text: "Финальный вес TF-IDF получается как произведение TF и IDF, что обеспечивает высокий вес термам, частым в одном документе и редким во всей коллекции. В работе применяется сублинейное масштабирование TF (sublinear_tf = True), при котором tf(t, d) заменяется на 1 + log tf(t, d), что снижает влияние терминов с аномально высокой частотой в одном документе [10]. Дополнительно вектор каждого документа нормируется по L2-норме, что приводит к скалярному произведению, эквивалентному косинусной мере сходства."

  - type: heading
    level: 3
    text: Наивный байесовский классификатор
  - type: paragraph
    text: "Наивный байесовский классификатор (Naive Bayes, NB) — вероятностная модель, основанная на теореме Байеса с допущением условной независимости признаков [16]. Для класса c и документа d, представленного вектором признаков (f_1, …, f_n), апостериорная вероятность вычисляется по формуле ({ref:eq_nb})."
  - type: math
    formula: "P(c|d) = \\frac{P(c) \\prod_{i=1}^{n} P(f_i|c)}{P(d)} \\propto P(c) \\prod_{i=1}^{n} P(f_i|c)"
    id: eq_nb
  - type: paragraph
    text: "Решающее правило относит документ к классу с наибольшей апостериорной вероятностью. В мультиномиальной версии для текстов условные вероятности P(f_i | c) оцениваются по обучающей выборке с лапласовским сглаживанием. Несмотря на нереалистичное допущение независимости, наивный Байес обеспечивает высокое качество в задачах текстовой классификации [16] и часто выступает в роли базовой линии для сравнения с более сложными моделями."

  - type: heading
    level: 3
    text: Логистическая регрессия и метод опорных векторов
  - type: paragraph
    text: "Логистическая регрессия (Logistic Regression, LR) — линейная вероятностная модель, в которой апостериорная вероятность класса представлена сигмоидным преобразованием линейной комбинации признаков. В многоклассовой постановке используется обобщение one-vs-rest или мультиномиальная (softmax) функция, описываемая формулой ({ref:eq_lr})."
  - type: math
    formula: "P(c_k | x) = \\frac{\\exp(w_k^T x + b_k)}{\\sum_{j=1}^{K} \\exp(w_j^T x + b_j)}"
    id: eq_lr
  - type: paragraph
    text: "Обучение модели проводится методом максимизации логарифмического правдоподобия с L2-регуляризацией. Метод опорных векторов с линейным ядром (Linear SVM) решает задачу нахождения разделяющей гиперплоскости с максимальным зазором. Joachims [11] показал, что для задач классификации текстов с TF-IDF-признаками линейный SVM обеспечивает наивысшее качество среди линейных моделей. Задача оптимизации формулируется по формуле ({ref:eq_svm})."
  - type: math
    formula: "\\min_{w, b} \\, \\frac{1}{2}\\|w\\|^2 + C \\sum_{i=1}^{n} \\max(0, 1 - y_i (w^T x_i + b))"
    id: eq_svm
  - type: paragraph
    text: "Параметр C регулирует баланс между шириной зазора и допуском к ошибкам обучения. В работе используется реализация LinearSVC из библиотеки scikit-learn [17], основанная на алгоритме LIBLINEAR и обеспечивающая линейную сложность по числу признаков."

  - type: heading
    level: 3
    text: Ансамблевые методы — случайный лес и градиентный бустинг
  - type: paragraph
    text: "Случайный лес (Random Forest, RF), предложенный Breiman [18], — ансамблевый метод, основанный на построении большого числа деревьев решений на бутстреп-выборках с случайным выбором подмножества признаков в каждой вершине. Финальное предсказание получается голосованием большинства, что описывается формулой ({ref:eq_rf})."
  - type: math
    formula: "\\hat{y}(x) = \\operatorname{arg}\\max_{c \\in C} \\sum_{t=1}^{T} \\mathbb{I}(h_t(x) = c)"
    id: eq_rf
  - type: paragraph
    text: "Случайный лес устойчив к переобучению при умеренном числе деревьев и не требует тщательной настройки гиперпараметров. Градиентный бустинг (Gradient Boosting Machine, GBM), предложенный Friedman [19], строит ансамбль деревьев последовательно: каждое новое дерево обучается на остатках предыдущего, минимизируя выбранную функцию потерь. Итеративное обновление модели описывается формулой ({ref:eq_gbm})."
  - type: math
    formula: "F_{m}(x) = F_{m-1}(x) + \\nu \\cdot h_m(x), \\; h_m = \\operatorname{arg}\\min_{h} \\sum_{i=1}^{n} L(y_i, F_{m-1}(x_i) + h(x_i))"
    id: eq_gbm
  - type: paragraph
    text: "Параметр ν (learning rate) контролирует скорость обучения и регуляризует ансамбль. Градиентный бустинг исторически демонстрирует наивысшее качество среди классических методов, однако обладает наибольшими вычислительными затратами на обучение [19]. В работе используется реализация GradientBoostingClassifier из scikit-learn [17]."

  - type: heading
    level: 2
    text: Алгоритм разработанной системы

  - type: heading
    level: 3
    text: Предобработка данных
  - type: paragraph
    text: "Алгоритм предобработки русскоязычных обращений в техподдержку построен с учётом особенностей разговорной банковской лексики и состоит из четырёх последовательных шагов. Все шаги объединены в единый pipeline scikit-learn и применяются к обращению как на этапе обучения, так и на этапе инференса. Подробная последовательность шагов отображена на диаграмме активности на рисунке {ref:fig_activity}."
  - type: paragraph
    text: "На первом шаге производится приведение текста к нижнему регистру, что устраняет различия между вариантами капитализации одного и того же слова (например, «Платёж», «платёж», «ПЛАТЁЖ»). На втором шаге удаляются URL-адреса и e-mail, поскольку они не несут полезной информации для типизации обращения. На третьем шаге удаляются все символы, не являющиеся буквами кириллицы, латиницы или цифрами, что одновременно убирает пунктуацию и эмодзи. На четвёртом шаге производится токенизация по пробельным символам и фильтрация: удаляются токены короче трёх символов и слова из стандартного списка русскоязычных стоп-слов."
  - type: paragraph
    text: "В отличие от классических текстовых задач, в работе сознательно не применяется лемматизация. Эта мера обусловлена двумя соображениями. Во-первых, лемматизация требует подключения внешнего лексического анализатора (например, pymorphy3), что увеличивает время инференса в 5–10 раз. Во-вторых, на данной задаче лемматизация даёт прирост качества менее одного процентного пункта по F1-мере, что не оправдывает усложнения системы. Биграммы в TF-IDF частично компенсируют отсутствие морфологической нормализации, фиксируя устойчивые сочетания (например, «не работает», «не приходит»)."

  - type: heading
    level: 3
    text: Построение модели и параметры
  - type: paragraph
    text: "После предобработки тексты подаются в TfidfVectorizer с параметрами: ngram_range = (1, 2), max_features = 20 000, sublinear_tf = True, min_df = 2. Минимальная документная частота min_df = 2 отсекает термы и биграммы, встречающиеся ровно в одном документе обучающей выборки и являющиеся, как правило, опечатками или уникальными именами собственными. Ограничение словаря 20 000 наиболее частотных признаков позволяет удержать память pipeline в пределах десятков мегабайт и сократить время инференса."
  - type: paragraph
    text: "Параметры классификаторов выбраны исходя из стандартных рекомендаций scikit-learn и предварительной настройки на отложенной выборке: для MultinomialNB параметр сглаживания α = 0,3; для LogisticRegression C = 2,0 и max_iter = 1000; для LinearSVC C = 1,0; для RandomForestClassifier — 200 деревьев и зерно случайного источника random_state = 42; для GradientBoostingClassifier — 150 итераций и random_state = 42. Тонкая настройка через сеточный поиск в рамках данной работы не проводилась, поскольку различия между классификаторами на исходных гиперпараметрах достаточно велики для содержательного сравнения."

  - type: heading
    level: 3
    text: Диаграмма компонентов системы
  - type: paragraph
    text: "Компонентная архитектура разработанной системы классификации представлена на рисунке {ref:fig_pipeline}. Система состоит из трёх логических слоёв: слоя получения и предобработки обращений, слоя машинного обучения и слоя представления результатов оператору."
  - type: image
    width_in: 6.0
    image:
      diagram:
        diagram_type: kroki
        kroki_type: plantuml
        filename: pipeline_bank_issues
        image_type: png
        index: 2
        code: |
          @startuml
          top to bottom direction
          component "Web-форма обращения" as Form
          component "Предобработка\nтекста" as Prep
          component "TF-IDF\nвекторизация" as Vect
          component "Классификатор\n(GBM)" as Clf
          component "Маршрутизатор\nи отчёт" as Router
          component "Веб-интерфейс\nоператора" as UI
          Form --> Prep
          Prep --> Vect
          Vect --> Clf
          Clf --> Router
          Router --> UI
          @enduml
  - type: figure_caption
    text: Диаграмма компонентов системы классификации обращений
    id: fig_pipeline
  - type: paragraph
    text: "Компонент «Web-форма обращения» обеспечивает приём текста обращения через HTTP API. Компоненты «Предобработка», «TF-IDF векторизация» и «Классификатор» объединены в единый sklearn Pipeline, что гарантирует идентичность обработки на этапе обучения и на этапе инференса. Компонент «Маршрутизатор и отчёт» реализует бизнес-логику маршрутизации: на основании предсказанного класса определяется целевая группа поддержки и формируется человекочитаемое описание решения. Компонент «Веб-интерфейс оператора» отображает результат классификации, ранжирование по уверенности и предлагаемую маршрутизацию."

  - type: heading
    level: 3
    text: Диаграмма алгоритма классификации
  - type: paragraph
    text: "Алгоритм обработки одного обращения от момента ввода текста до выдачи результата оператору представлен на рисунке {ref:fig_activity}."
  - type: image
    width_in: 5.5
    image:
      diagram:
        diagram_type: kroki
        kroki_type: plantuml
        filename: activity_classify_bank
        image_type: png
        index: 3
        code: |
          @startuml
          start
          :Получить текст обращения;
          :Привести к нижнему регистру;
          :Удалить URL и спецсимволы;
          :Токенизировать и отсечь стоп-слова;
          :Построить TF-IDF вектор;
          :Предсказать класс и уверенности;
          if (Уверенность > порога?) then (да)
            :Маршрутизировать в профильную группу;
          else (нет)
            :Передать оператору на ручную разметку;
          endif
          :Сохранить тикет и вернуть результат;
          stop
          @enduml
  - type: figure_caption
    text: Диаграмма алгоритма обработки обращения клиента
    id: fig_activity
  - type: paragraph
    text: "Ключевым элементом алгоритма является ветвление по порогу уверенности. Если максимальная апостериорная вероятность по классам ниже установленного порога (в данной работе использовано значение 0,4), обращение передаётся на ручную классификацию оператору первой линии — это обращения, в которых модель не уверена и автоматическая маршрутизация может привести к ошибке. Такой подход реализует принцип Human-in-the-Loop и обеспечивает плавную деградацию качества системы в пограничных случаях."

  - type: heading
    level: 2
    text: Ограничения модели и требования к данным
  - type: paragraph
    text: "Разработанная модель имеет ряд принципиальных ограничений, которые необходимо учитывать при её эксплуатации. Во-первых, модель обучается на исторических обращениях и при появлении новых типов неполадок (например, после релиза новой функции в приложении) требует дообучения. Регулярное переобучение раз в одну-две недели на актуальных данных — обязательное условие поддержания качества. Во-вторых, модель не различает контекст обращения: одно и то же сообщение от премиум-клиента и обычного клиента классифицируется одинаково, что может приводить к нарушению приоритизации в пограничных категориях. Учёт контекста требует расширения признакового пространства, что выходит за рамки данной работы."
  - type: paragraph
    text: "Требования к обучающим данным: минимум 200–300 размеченных примеров на каждый класс для стабильной работы линейных моделей; качество разметки не ниже 90% межэкспертного согласия; обновление обучающей выборки не реже одного раза в две недели. При невыполнении этих требований ожидаемое снижение F1-меры составляет 5–10 процентных пунктов. К входным обращениям предъявляются минимальные требования: длина не менее 5 слов (более короткие обращения признаются недостаточными для классификации и передаются оператору), кодировка UTF-8, отсутствие шаблонных автоответов и пустых сообщений."

  # =====================================================================
  # ГЛАВА 6: Экспериментальная часть
  # =====================================================================
  - type: heading
    level: 1
    text: Экспериментальная часть

  - type: heading
    level: 2
    text: Описание набора данных

  - type: heading
    level: 3
    text: Характеристика датасета
  - type: paragraph
    text: "Для проведения эксперимента сформирован синтетический датасет обращений клиентов в техническую поддержку мобильного банковского приложения. Использование синтетического датасета обусловлено двумя соображениями: во-первых, реальные обращения клиентов содержат персональные данные и составляют банковскую тайну, что делает невозможным их публикацию в учебной работе; во-вторых, синтетический генератор позволяет точно контролировать распределение классов и долю двусмысленных обращений, моделируя реалистичный «label noise» в обучающих данных. Структура полей датасета представлена в таблице {ref:tbl_dataset_schema}."
  - type: paragraph
    text: "В таблице {ref:tbl_dataset_schema} представлена схема датасета и приведены примеры обращений по каждому полю."
  - type: table
    caption: Схема полей синтетического датасета обращений
    id: tbl_dataset_schema
    data:
    - ["Поле", "Тип", "Описание", "Пример"]
    - ["text", "str", "Текст обращения клиента на русском языке", "Перевод по СБП на 5000 рублей завис уже 30 минут"]
    - ["label", "str", "Метка категории неполадки", "payment"]
    - ["label_ru", "str", "Русскоязычная подпись категории", "Платежи и переводы"]
    - ["length_chars", "int", "Длина обращения в символах", "82"]
    - ["length_words", "int", "Длина обращения в словах", "12"]
    - ["is_ambiguous", "bool", "Признак двусмысленного обращения (label noise)", "false"]
  - type: paragraph
    text: "Генератор синтетических обращений построен на принципе шаблонного раскрытия слотов: для каждой из шести категорий неполадок составлены 9 базовых текстовых шаблонов; в каждом шаблоне присутствуют слоты для подстановки названия банковского приложения, типа аутентификации, кода ошибки, суммы операции, длительности ожидания и других характерных элементов. Дополнительно в датасет включена группа из 12 двусмысленных шаблонов, каждый из которых при генерации получает одну из двух правомерных меток случайным образом — это создаёт реалистичный неустранимый Bayes error на уровне 5–7%. Распределение обращений по классам приведено в таблице {ref:tbl_dataset}."
  - type: paragraph
    text: "В таблице {ref:tbl_dataset} представлено распределение обращений по категориям технических неполадок в сформированном датасете."
  - type: table
    caption: Распределение обращений по категориям неполадок
    id: tbl_dataset
    data:
    - ["Класс", "Кол-во", "Доля, %", "Источник разметки"]
    - ["Аутентификация", "240", "14,7", "Синтетический генератор"]
    - ["Платежи и переводы", "240", "14,7", "Синтетический генератор"]
    - ["Производительность", "240", "14,7", "Синтетический генератор"]
    - ["Интерфейс", "240", "14,7", "Синтетический генератор"]
    - ["Сетевые ошибки", "240", "14,7", "Синтетический генератор"]
    - ["Банковские карты", "240", "14,7", "Синтетический генератор"]
    - ["Двусмысленные обращения (label noise)", "192", "11,8", "Случайное назначение меток"]
    - ["Итого", "1632", "100,0", "—"]

  - type: heading
    level: 3
    text: Распределение классов и статистика
  - type: paragraph
    text: "Распределение обращений по классам сбалансировано: на каждую из шести категорий приходится по 240 «чистых» примеров. Дополнительные 192 двусмысленных обращения распределены между классами случайным образом, что в сумме даёт выборку из 1632 обращений. Распределение показано на рисунке {ref:fig_dist}."
  - type: image
    width_in: 5.5
    image:
      diagram:
        diagram_type: matplotlib
        filename: dist_bank_classes
        image_type: png
        index: 4
        code: |
          import matplotlib
          matplotlib.use('Agg')
          import matplotlib.pyplot as plt

          labels = ['Аутент.', 'Платежи', 'Произв-сть',
                    'Интерфейс', 'Сеть', 'Карты']
