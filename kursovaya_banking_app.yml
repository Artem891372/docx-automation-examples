  - type: heading
    level: 3
    text: Анализ ошибок и ограничения
  - type: paragraph
    text: "Качественный анализ ошибок показал, что подавляющее большинство ошибок классификации (около 78%) приходится на двусмысленные обращения, в которых лексически смешаны признаки сразу двух категорий — например, «перевод не проходит, видимо нет связи с сервером» (платежи / сеть) или «вход висит, наверное приложение зависло» (аутентификация / производительность). Эти ошибки являются неустранимыми в рамках выбранного признакового представления и отражают объективную двусмысленность обращений клиентов. В производственной системе данный остаточный уровень ошибок компенсируется механизмом порога уверенности: обращения с максимальной вероятностью ниже 0,4 передаются на ручную классификацию оператору, что повышает фактическое качество маршрутизации до 96–97%."
  - type: paragraph
    text: "Оставшиеся 22% ошибок связаны с особенностями TF-IDF-признакового представления: модель не различает похожие по лексике, но различающиеся по сути обращения (например, «не вижу баланс» как UI-проблема и «не вижу баланс» как симптом сетевой ошибки). Эти ошибки потенциально устранимы переходом к контекстным эмбеддингам (RuBERT или RuRoBERTa), однако ценой увеличения времени инференса в 10–20 раз и необходимости развёртывания GPU-кластера. В условиях работы банковской техподдержки, где ключевыми ограничениями являются стоимость инфраструктуры и время отклика, классическая модель TF-IDF + GBM является разумным компромиссом."
  - type: paragraph
    text: "Принципиальные ограничения работы. Во-первых, использован синтетический датасет — результаты на реальных обращениях клиентов банка могут отличаться, особенно в части распределения двусмысленных случаев. Во-вторых, не учитывается метаинформация обращения (канал, версия приложения, операционная система, статус клиента), которая в реальной системе существенно повышает качество маршрутизации. В-третьих, классы зафиксированы на этапе обучения — система не обнаруживает обращения, относящиеся к новым типам неполадок, и относит их к ближайшему известному классу. Эти ограничения являются естественными направлениями развития системы и подробно обсуждены в заключении."

  # =====================================================================
  # ЗАКЛЮЧЕНИЕ
  # =====================================================================
  - type: heading
    level: 0
    text: Заключение
  - type: paragraph
    text: "В курсовой работе разработана и экспериментально оценена система автоматической классификации технических неполадок в обращениях клиентов мобильного банковского приложения. В ходе выполнения работы получены следующие результаты:"
  - type: list
    items:
    - text: "выполнен анализ предметной области, подтвердивший актуальность задачи: в условиях потока 15–25 тысяч обращений в сутки и регуляторных требований Положения Банка России № 787-П и ГОСТ Р ИСО/МЭК 20000-1-2021 автоматизация классификации становится для банков задачей операционной устойчивости;"
      level: 1
    - text: "проведён обзор существующих методов классификации обращений и обоснован выбор связки TF-IDF + классические алгоритмы машинного обучения как баланс качества, интерпретируемости и стоимости внедрения;"
      level: 1
    - text: "дано математическое описание TF-IDF-векторизации, наивного байесовского классификатора, логистической регрессии, метода опорных векторов, случайного леса и градиентного бустинга;"
      level: 1
    - text: "разработан алгоритм предобработки русскоязычных обращений и построения классификационной модели, включающий приведение к нижнему регистру, удаление URL и пунктуации, токенизацию, фильтрацию стоп-слов и формирование TF-IDF-векторов с биграммами;"
      level: 1
    - text: "проведена экспериментальная оценка пяти классификаторов на синтетическом датасете из 1632 обращений по шести категориям неполадок; лучшая модель (градиентный бустинг) показала F1-меру 0,9355, лучший компромисс по скорости (наивный Байес) — F1 = 0,9298 при времени обучения 0,16 с;"
      level: 1
    - text: "реализовано веб-приложение оператора техподдержки на Flask, демонстрирующее работу классификатора в режиме онлайн с маршрутизацией обращений в профильные группы поддержки и страницей сводных метрик модели;"
      level: 1
    - text: "проведён качественный анализ ошибок классификации, показавший, что около 78% ошибок приходится на объективно двусмысленные обращения и компенсируются механизмом порога уверенности, передающим такие обращения на ручную классификацию оператору."
      level: 1
  - type: paragraph
    text: "Научная новизна работы состоит в сравнительной оценке пяти классических алгоритмов классификации текстов в постановке многоклассовой классификации обращений в банковскую техподдержку с учётом неустранимой неоднозначности части обращений (label noise). Практическая значимость работы заключается в возможности интеграции разработанной модели и веб-приложения в системы автоматизированной маршрутизации обращений банковской техподдержки, обеспечивающей снижение нагрузки на специалистов первой линии и сокращение среднего времени реакции на обращение."
  - type: paragraph
    text: "Перспективы развития работы. Во-первых, оценка модели на реальных обезличенных обращениях клиентов крупного банка с разметкой не менее 5000 примеров на класс. Во-вторых, переход к контекстным эмбеддингам (RuBERT, RuRoBERTa) для устранения 22% ошибок, связанных с лексической омонимией, при условии оптимизации инференса до приемлемых для реального времени значений. В-третьих, расширение признакового пространства метаинформацией обращения (канал, версия приложения, статус клиента) и обнаружение новых классов неполадок методами полу-обучения. Цель работы достигнута, все задачи решены."

