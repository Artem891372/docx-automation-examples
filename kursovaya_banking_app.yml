  - type: figure_caption
    text: Распределение обращений по категориям технических неполадок
    id: fig_dist
  - type: paragraph
    text: "Средняя длина обращения в датасете составляет 78 символов или 12 слов; распределение длин близко к нормальному с длинным «хвостом» вправо — отдельные обращения достигают 250–300 символов, что соответствует развёрнутым описаниям с упоминанием контекста (например, «уже неделю никак не могу зайти, был у меня и Сбер, и Тинькофф — нигде такой ошибки не было»). Сбалансированность классов и реалистичная вариативность длин делают датасет пригодным для содержательного сравнения классификаторов."

  - type: heading
    level: 2
    text: Условия и методология эксперимента

  - type: heading
    level: 3
    text: Программно-аппаратная среда
  - type: paragraph
    text: "Эксперимент проведён в среде Python 3.12 с использованием библиотек scikit-learn 1.8.0, NumPy, Flask 3.1 (для веб-приложения), Selenium 4.44 (для сбора скриншотов интерфейса) и Matplotlib 3.10 (для визуализации). Аппаратная конфигурация: процессор Intel x86_64, оперативная память 16 ГБ, без использования графического ускорителя. Обучение всех пяти моделей и оценка качества на сформированном датасете укладываются в 20 секунд на одном ядре."

  - type: heading
    level: 3
    text: Методология оценивания
  - type: paragraph
    text: "Для оценки качества моделей применена двухуровневая схема. На первом уровне выборка разбивается на обучающую (80%) и тестовую (20%) части стратифицированным сэмплированием с фиксированным зерном случайного генератора, что гарантирует воспроизводимость результатов. На втором уровне на обучающей выборке проводится стратифицированная 5-кратная перекрёстная проверка (StratifiedKFold с shuffle=True, random_state=42) с оптимизацией по метрике F1-macro. Финальные метрики качества рассчитываются на отложенной тестовой выборке, не использовавшейся при обучении и кросс-валидации."
  - type: paragraph
    text: "Все пять классификаторов обучаются на идентичных обучающей и тестовой подвыборках, что обеспечивает корректность сравнения. Различия в качестве между моделями обусловлены исключительно различиями в алгоритме, а не в данных. Для каждой модели фиксируются: общая точность (Accuracy), макроусреднённые Precision, Recall и F1-мера, среднее значение и стандартное отклонение F1-macro по 5 фолдам кросс-валидации, а также время обучения в секундах."

  - type: heading
    level: 2
    text: Результаты и анализ

  - type: heading
    level: 3
    text: Сравнение классификаторов
  - type: paragraph
    text: "Сводные результаты сравнения пяти классификаторов на тестовой выборке приведены в таблице {ref:tbl_metrics}. Все значения метрик получены на одной и той же отложенной выборке размером 327 обращений; время обучения замерено на полной обучающей выборке размером 1305 обращений."
  - type: paragraph
    text: "В таблице {ref:tbl_metrics} приведены метрики качества пяти классификаторов на тестовой выборке."
  - type: table
    caption: Сравнение метрик качества классификаторов
    id: tbl_metrics
    data:
    - ["Алгоритм", "Accuracy", "Precision", "Recall", "F1-macro", "Время обуч., с"]
    - ["NB (наивный Байес)", "0,9297", "0,9298", "0,9314", "0,9298", "0,16"]
    - ["LR (логистическая регрессия)", "0,9235", "0,9234", "0,9244", "0,9228", "0,30"]
    - ["SVM (LinearSVC)", "0,9266", "0,9268", "0,9265", "0,9258", "0,18"]
    - ["RF (случайный лес)", "0,9266", "0,9278", "0,9278", "0,9263", "1,60"]
    - ["GBM (градиентный бустинг)", "0,9358", "0,9372", "0,9360", "0,9355", "17,17"]
  - type: paragraph
    text: "Лучший результат показал градиентный бустинг (GBM) с F1-мерой 0,9355, что согласуется с результатами обзорных работ [13, 19] для задач многоклассовой классификации коротких текстов. Однако время обучения GBM (17,17 с) в 100 раз превышает время обучения LinearSVC (0,18 с), что в условиях регулярного дообучения модели (раз в две недели на накопленных данных) делает разрыв в качестве (всего 1 процентный пункт) недостаточным для производственного выбора в пользу GBM. Наивный байесовский классификатор показал второй результат (F1 = 0,9298) при минимальном времени обучения, что подтверждает классический тезис о его эффективности как сильной базовой линии в задачах классификации коротких текстов [16]."

  - type: heading
    level: 3
    text: Матрица ошибок лучшей модели
  - type: paragraph
    text: "Для детального анализа поведения лучшей модели (градиентного бустинга) на отложенной тестовой выборке построена матрица ошибок, представленная в таблице {ref:tbl_confusion}. Строки матрицы соответствуют истинным меткам, столбцы — предсказанным."
  - type: paragraph
    text: "В таблице {ref:tbl_confusion} приведена матрица ошибок модели GBM на тестовой выборке."
  - type: table
    caption: Матрица ошибок модели GBM на тестовой выборке
    id: tbl_confusion
    data:
    - ["факт \\ предсказание", "Аутент.", "Платежи", "Произв.", "Интерф.", "Сеть", "Карты"]
    - ["Аутентификация",   "43", "2",  "2",  "2",  "0",  "0"]
    - ["Платежи и переводы", "0",  "48", "0",  "0",  "0",  "3"]
    - ["Производительность", "1", "0",  "53", "0",  "0",  "0"]
    - ["Интерфейс",         "0", "0",  "0",  "50", "0",  "2"]
    - ["Сетевые ошибки",    "1", "2",  "2",  "0",  "56", "2"]
    - ["Банковские карты",  "0", "0",  "0",  "1",  "1",  "56"]
  - type: paragraph
    text: "Анализ матрицы ошибок показывает, что наибольшая доля ошибок приходится на класс «Аутентификация» (8 ошибок из 49 истинных, или 16,3%), что объясняется лексической близостью обращений по аутентификации к категориям «Производительность» (зависание на экране входа), «Интерфейс» (кнопка не нажимается) и «Платежи» (sms-код для подтверждения не приходит). Это типичные пограничные случаи, в которых ошибка модели соответствует объективной двусмысленности обращения. На массовой категории «Платежи и переводы» модель допускает всего 3 ошибки из 51 (5,9%), причём все ошибки направлены в смежную категорию «Карты», что также объясняется лексической близостью «оплата картой не проходит» и «не вижу карту в приложении»."

  - type: heading
    level: 3
    text: Сравнение по ключевым метрикам
  - type: paragraph
    text: "Графическое представление сравнения классификаторов по двум ключевым метрикам — Accuracy и F1-macro — приведено на рисунке {ref:fig_metrics}. Малая разница между Accuracy и F1-macro для каждой модели подтверждает, что сбалансированность датасета не приводит к расхождению этих метрик и обе они могут использоваться взаимозаменяемо при подобном распределении классов."
  - type: image
    width_in: 6.5
    image:
      diagram:
        diagram_type: matplotlib
        filename: metrics_bank_chart
        image_type: png
        index: 5
        code: |
          import matplotlib
          matplotlib.use('Agg')
          import matplotlib.pyplot as plt
          import numpy as np

          classifiers = ['NB', 'LR', 'SVM', 'RF', 'GBM']
          accuracy = [0.9297, 0.9235, 0.9266, 0.9266, 0.9358]
          f1       = [0.9298, 0.9228, 0.9258, 0.9263, 0.9355]

          x = np.arange(len(classifiers))
          w = 0.35
          fig, ax = plt.subplots(figsize=(8, 5))
          b1 = ax.bar(x - w/2, accuracy, w, label='Accuracy',
                      color='#4472C4', edgecolor='black', linewidth=0.5)
          b2 = ax.bar(x + w/2, f1, w, label='F1-macro',
                      color='#ED7D31', edgecolor='black', linewidth=0.5)
          ax.set_ylabel('Значение метрики')
          ax.set_title('Сравнение метрик качества классификаторов')
          ax.set_xticks(x); ax.set_xticklabels(classifiers)
          ax.set_ylim(0.90, 0.945)
          ax.legend(loc='lower right'); ax.grid(axis='y', alpha=0.3, linestyle='--')
          for b in list(b1) + list(b2):
              ax.text(b.get_x()+b.get_width()/2, b.get_height()+0.0005,
                      f'{b.get_height():.3f}', ha='center', va='bottom', fontsize=8)
          plt.tight_layout()
