  - type: code
    caption: Функция предобработки русскоязычного обращения
    id: lst_preprocess
    code: |
      import re
      from typing import List

      _RUSSIAN_STOPWORDS = {
          "и", "в", "во", "не", "что", "он", "на", "я", "с", "со", "как",
          "а", "то", "все", "она", "так", "его", "но", "да", "ты", "к",
          "у", "же", "вы", "за", "бы", "по", "только", "ее", "мне",
          # ... сокращено для приложения, полный список из 130+ слов
      }

      _TOKEN_RE = re.compile(r"[a-zа-яё0-9]+", re.IGNORECASE)


      def preprocess(text: str) -> List[str]:
          """Нормализует обращение клиента банка."""
          text = text.lower()
          text = re.sub(r"http\S+|www\S+", " ", text)
          text = re.sub(r"[^a-zа-яё0-9\s]", " ", text)
          tokens = _TOKEN_RE.findall(text)
          return [t for t in tokens
                  if len(t) > 2 and t not in _RUSSIAN_STOPWORDS]


      def preprocess_to_string(text: str) -> str:
          return " ".join(preprocess(text))
  - type: code
    caption: Построение Pipeline и кросс-валидация
    id: lst_pipeline
    code: |
      from sklearn.pipeline import Pipeline
      from sklearn.feature_extraction.text import TfidfVectorizer
      from sklearn.ensemble import GradientBoostingClassifier
      from sklearn.model_selection import StratifiedKFold, cross_val_score
      import numpy as np


      def build_pipeline(clf=None) -> Pipeline:
          if clf is None:
              clf = GradientBoostingClassifier(
                  n_estimators=150, random_state=42)
          return Pipeline([
              ("tfidf", TfidfVectorizer(
                  preprocessor=preprocess_to_string,
                  ngram_range=(1, 2),
                  max_features=20_000,
                  sublinear_tf=True,
                  min_df=2,
              )),
              ("clf", clf),
          ])


      pipeline = build_pipeline()
      cv = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)
      scores = cross_val_score(pipeline, X_train, y_train,
                               cv=cv, scoring="f1_macro", n_jobs=-1)
      print(f"CV F1-macro: {np.mean(scores):.4f} ± {np.std(scores):.4f}")

      pipeline.fit(X_train, y_train)
  - type: code
    caption: Оценка модели и вывод метрик
    id: lst_evaluate
    code: |
      from sklearn.metrics import (
          accuracy_score, precision_score, recall_score,
          f1_score, classification_report, confusion_matrix,
      )


      def evaluate(model, X_test, y_test, class_names=None):
          y_pred = model.predict(X_test)
          print(f"Accuracy : {accuracy_score(y_test, y_pred):.4f}")
          print(f"Precision: "
                f"{precision_score(y_test, y_pred, average='macro'):.4f}")
          print(f"Recall   : "
                f"{recall_score(y_test, y_pred, average='macro'):.4f}")
          print(f"F1-macro : "
                f"{f1_score(y_test, y_pred, average='macro'):.4f}")
          print("\nПодробный отчёт:")
          print(classification_report(
              y_test, y_pred, target_names=class_names, zero_division=0))
          print("Матрица ошибок:")
          print(confusion_matrix(y_test, y_pred))


      evaluate(pipeline, X_test, y_test,
               class_names=["auth", "payment", "performance",
                            "ui", "network", "card"])
